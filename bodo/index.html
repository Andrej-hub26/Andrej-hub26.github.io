@media (orientation:portrait) and (max-width:1100px){#rot{display:flex}}

<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div></div>
<script>
'use strict';
/* ===== Bodo a Rýchlíci – akčná hra pre Maťka a Adamka ===== */
const cv=document.getElementById('c');let c=cv.getContext('2d');
const VH=720,PI=Math.PI,TAU=PI*2,OL='#2a1a12';
let VW=1280,S=1,DPR=1,qual=2,T=0,scr='splash',fade=1,btns=[],press=null,PL=null,G=null,R=null,MT=0;
const FX=[];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],hyp=Math.hypot,lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(window.devicePixelRatio||1,qual);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';S=cv.height/VH;VW=cv.width/S;SKY={}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- ukladanie ---------- */
const KEY='bodoRychlici.v1';
const blankP=()=>({st:{},intro:0,fin:0});
const blank=()=>({snd:1,matko:blankP(),adamko:blankP()});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.matko&&s.adamko)return s}catch(e){}return blank()}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}
const NM={matko:{N:'Maťko'},adamko:{N:'Adamko'}};

/* ---------- hlas ---------- */
let skV=null,sayTok=0,lastSayAt=-9;
function pickV(){try{const vs=speechSynthesis.getVoices();skV=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,cb,pitch){const tok=++sayTok;let done=false;lastSayAt=T;const fin=()=>{if(done||tok!==sayTok)return;done=true;if(cb)cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skV)u.voice=skV;u.rate=pitch?.92:1;u.pitch=pitch||1.1;u.onend=()=>setTimeout(fin,250);speechSynthesis.speak(u)}catch(e){}
  if(cb)setTimeout(fin,1800+t.length*95)}
function bearSay(t,cb){say(t,cb,.45)}
function speaking(){try{return speechSynthesis.speaking}catch(e){return false}}
function sayQ(t,force){if(force||(!speaking()&&T-lastSayAt>1.4))say(t)}
function hush(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let primed=false;function prime(){if(primed)return;primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const PRAISE=['Super!','Výborne!','Bravó!','Paráda!','Jupí!','Skvelé!','Si šikovný!'];


/* ---------- zvuky a hudba ---------- */
let AC=null,OUT=null,MUS=null,NB=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=1;MUS.connect(OUT)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,f2,delay,dest){const a=AC;if(!a||a.state!=='running')return;if(!SAVE.snd&&dest===MUS)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05)}
function noise(d,f,q,vol,f2,delay,dest){const a=AC;if(!a||a.state!=='running')return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=a.currentTime+(delay||0),s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest||OUT);s.start(t);s.stop(t+d+.05)}catch(e){}}
const SFX={
  tap(){tone(700,.08,'sine',.18,900)},
  jump(){tone(330,.18,'square',.07,660);tone(500,.16,'sine',.12,1000)},
  bump(){noise(.25,300,1,.45,120);tone(120,.25,'sine',.25,60)},
  splash(){noise(.5,1400,.7,.4,300);noise(.3,600,1,.3,200,.08)},
  grab(){[880,1175,1568].forEach((f,i)=>tone(f,.12,'triangle',.15,0,i*.05))},
  boost(){tone(300,.5,'sawtooth',.08,1200);noise(.5,2000,1,.15,4000)},
  spring(){tone(220,.4,'square',.08,880);tone(440,.4,'sine',.1,1760)},
  boing(){tone(180,.45,'sine',.25,520);tone(90,.3,'triangle',.15,260,.05)},
  swat(){noise(.18,900,.8,.5,300);tone(160,.18,'square',.08,70)},
  squeak(){const f=rnd(1500,1900);tone(f,.3,'sine',.16,f*1.7);tone(f*1.4,.2,'triangle',.06,f*2,.1)},
  giggle(){[1500,1850,1500,1950,1600].forEach((f,i)=>tone(f,.07,'sine',.11,f*1.12,i*.08))},
  roar(){noise(.8,380,.6,.4,140);tone(140,.7,'sawtooth',.13,80)},
  ouch(){tone(260,.25,'sawtooth',.1,140);noise(.2,500,1,.25,200)},
  steal(){[900,1200,1500].forEach((f,i)=>tone(f,.09,'triangle',.1,0,i*.06))},
  back(){[784,1047,1319].forEach((f,i)=>tone(f,.12,'triangle',.16,0,i*.07))},
  throw(){noise(.12,2500,1.5,.25,900)},
  hit(){tone(520,.1,'square',.08,260);noise(.1,1500,1,.3,500)},
  clang(){tone(1200,.3,'triangle',.12,1100);tone(1800,.25,'sine',.08,1700)},
  hurt(){tone(400,.35,'square',.08,150);tone(300,.35,'sine',.15,120)},
  boom(){noise(1.1,200,.5,.6,60);tone(90,.9,'sine',.3,35)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.18,0,i*.12))},
  lose(){[392,330,262].forEach((f,i)=>tone(f,.3,'triangle',.15,0,i*.22))},
  star(){tone(1320,.3,'sine',.16,1980)},
  go(){[523,784,1047].forEach((f,i)=>tone(f,.15,'square',.08,0,i*.09))}
};
const MEL={menu:[0,4,7,4,9,7,4,2,0,2,4,7,5,4,2,-1],run:[0,0,7,0,10,0,7,5,0,0,7,0,12,10,7,5],def:[0,-1,3,5,7,-1,5,3,0,-1,3,5,10,7,5,3],boss:[0,0,3,0,6,0,5,3,0,0,3,0,7,6,5,3]};
let musStep=0,musNext=0;
function musicTick(){if(!AC||AC.state!=='running'||!SAVE.snd)return;let m=MEL.menu,spb=.22,typ='triangle',vol=.03,drum=0;
  if(scr==='play'&&G&&!G.wait&&!G.end){m=MEL[G.mode];spb=G.mode==='boss'?.14:G.mode==='run'?.15:.17;typ='square';vol=.022;drum=1}
  MUS.gain.value=speaking()?.35:1;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){const n=m[musStep%16],d=musNext-AC.currentTime,base=G&&G.mode==='boss'?330:392;if(n>=0)tone(base*Math.pow(2,n/12),spb*.6,typ,vol,0,d,MUS);
    if(musStep%2===0){const bs=[0,0,-5,-2][(musStep>>3)%4];tone(98*Math.pow(2,bs/12),spb*1.6,'triangle',.07,0,d,MUS)}
    if(drum){if(musStep%4===0)tone(130,.15,'sine',.16,45,d,MUS);if(musStep%4===2)noise(.08,6000,1,.05,0,d,MUS);if(musStep%8===4)noise(.12,1800,.7,.08,0,d,MUS)}
    musStep++;musNext+=spb}}

/* ---------- kresliace pomôcky ---------- */
function P(){c.beginPath()}
function E(x,y,rx,ry){c.moveTo(x+Math.abs(rx),y);c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,TAU)}
function FS(f,lw){c.fillStyle=f;c.fill();if(lw!==0){c.lineWidth=lw||4;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function ST(lw,col){c.lineWidth=lw;c.strokeStyle=col||OL;c.lineJoin='round';c.lineCap='round';c.stroke()}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(R0,r){P();for(let k=0;k<10;k++){const a=-PI/2+k*PI/5,q=k%2?r:R0;k?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
function hl(x,y,rx,ry,a){P();E(x,y,rx,ry);c.fillStyle='rgba(255,255,255,'+(a||.4)+')';c.fill()}
function eyes(x1,x2,y,er,lx,ly,o){o=o||{};[x1,x2].forEach((x,i)=>{
  if(o.blink||o.closed){P();c.moveTo(x-er,y+(o.closed?er*.3:0));c.quadraticCurveTo(x,y+er*(o.closed?-.7:.4),x+er,y+(o.closed?er*.3:0));c.lineWidth=Math.max(3,er*.3);c.strokeStyle=OL;c.lineCap='round';c.stroke();return}
  if(o.squeeze){P();const s=i?-1:1;c.moveTo(x-s*er,y-er*.6);c.lineTo(x+s*er*.6,y);c.lineTo(x-s*er,y+er*.6);c.lineWidth=Math.max(3,er*.3);c.strokeStyle=OL;c.lineCap='round';c.lineJoin='round';c.stroke();return}
  P();E(x,y,er,er*1.18);FS('#fff',Math.max(2,er*.22));
  const pr=o.small?.34:.56;
  P();E(x+lx*er*.38,y+ly*er*.42,er*pr,er*pr*1.14);c.fillStyle='#20141c';c.fill();
  P();E(x+lx*er*.38-er*.15,y+ly*er*.42-er*.2,er*.17,er*.17);c.fillStyle='#fff';c.fill();
  if(o.angry){P();const s=i?-1:1;c.moveTo(x-s*er*1.1,y-er*1.7);c.lineTo(x+s*er*.9,y-er*1.0);c.lineWidth=er*.38;c.strokeStyle=OL;c.lineCap='round';c.stroke()}})}
function txt(s,x,y,size,col,al,lw){c.font='800 '+size+'px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';if(lw!==0){c.lineWidth=lw||size*.22;c.strokeStyle=OL;c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function puffs(B,col,lw){P();B.forEach(b=>E(b[0],b[1],b[2],b[3]));if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}c.fillStyle=col;c.fill()}
function bubble(x,y,r,fn){c.save();c.translate(x,y);P();E(0,0,r,r*.86);FS('#fff',4);P();E(-r*.55,r*.95,r*.16,r*.14);E(-r*.8,r*1.25,r*.09,r*.08);FS('#fff',3);fn(r);c.restore()}

/* ---------- deti ---------- */
function kidFace(which,r){const big=which==='matko';P();E(-r*.95,r*.05,r*.16,r*.22);E(r*.95,r*.05,r*.16,r*.22);FS('#f1c19b',3.5);
  P();E(0,0,r,r*1.02);FS('#f5c9a4',4.5);hl(-r*.35,-r*.35,r*.3,r*.2,.25);
  if(big){P();c.moveTo(-r*1.0,-r*.05);c.bezierCurveTo(-r*1.12,-r*1.2,r*1.12,-r*1.2,r*1.0,-r*.05);c.quadraticCurveTo(r*.85,-r*.55,r*.38,-r*.58);c.quadraticCurveTo(r*.1,-r*.36,-r*.12,-r*.6);c.quadraticCurveTo(-r*.7,-r*.52,-r*1.0,-r*.05);c.closePath();FS('#7a4a28',4)}
  else{P();c.moveTo(-r*1.02,-r*.22);c.bezierCurveTo(-r*1.0,-r*1.28,r*1.0,-r*1.28,r*1.02,-r*.22);c.closePath();FS('#e0702e',4);P();rr(-r*1.1,-r*.42,r*2.2,r*.28,r*.13);FS('#f2c14a',3.5);P();E(0,-r*1.14,r*.24,r*.24);FS('#f2c14a',3.5)}
  eyes(-r*.36,r*.36,r*.08,r*.17,0,.1,{blink:(T*1.1+(big?0:1.3))%3.4<.12});P();E(-r*.58,r*.36,r*.15,r*.09);E(r*.58,r*.36,r*.15,r*.09);c.fillStyle='rgba(255,120,140,.45)';c.fill();
  P();c.moveTo(-r*.06,r*.22);c.quadraticCurveTo(0,r*.3,r*.06,r*.22);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  P();c.moveTo(-r*.3,r*.4);c.quadraticCurveTo(0,r*.72,r*.3,r*.4);c.closePath();FS('#c23a4f',3)}


/* ---------- postavy: medveď Bodo ---------- */
const BF='#3b3034',BF2='#2a2124',BMZ='#c99b6d',BAND='#e5532e',BBL='#4c4044';
function bLeg(x,y,a,col,len){c.save();c.translate(x,y);c.rotate(a);P();rr(-17,-10,34,len+10,16);FS(col,4);P();E(7,len-1,23,12);FS(col,4);c.restore()}
function bearSide(x,y,s,o){o=o||{};const ph=o.ph||0,sw=Math.sin(ph);
  c.save();c.translate(x,y);c.scale(s*(o.dir||1),s);if(o.rot)c.rotate(o.rot);
  if(o.duck)c.scale(1.12,.58);
  const bob=o.jump||o.stand?0:-Math.abs(Math.cos(ph))*7;c.translate(0,bob);
  bLeg(-62,-72,o.jump?.8:o.stand?0:-sw*.75,BF2,62);bLeg(58,-72,o.jump?-.9:o.stand?0:sw*.75,BF2,62);
  P();c.moveTo(-105,-95);c.bezierCurveTo(-112,-168,-20,-182,42,-164);c.bezierCurveTo(98,-152,122,-122,114,-86);c.bezierCurveTo(106,-52,-60,-44,-96,-62);c.closePath();FS(BF,4.5);
  P();E(-14,-152,58,13);c.fillStyle='rgba(255,255,255,.08)';c.fill();
  P();E(-108,-112,13,11);FS(BF,3.5);
  bLeg(-46,-72,o.jump?1:o.stand?0:sw*.75,BF,64);bLeg(72,-72,o.jump?-.7:o.stand?0:-sw*.75,BF,64);
  P();c.moveTo(84,-162);c.lineTo(122,-98);c.lineTo(66,-120);c.closePath();FS(BAND,3.5);P();E(104,-124,3,3);E(92,-138,3,3);c.fillStyle='#fff';c.fill();
  c.save();c.translate(114,-160);c.rotate(o.jump?-.15:o.duck?.15:Math.sin(ph*2)*.03);
  P();E(-22,-40,17,17);E(18,-44,17,17);FS(BF,4);P();E(-22,-40,8,8);E(18,-44,8,8);c.fillStyle='#8a6a5c';c.fill();
  P();E(0,0,52,46);FS(BF,4.5);
  P();c.moveTo(16,-14);c.bezierCurveTo(60,-22,84,-2,82,16);c.bezierCurveTo(80,36,40,40,18,26);c.closePath();FS(BMZ,4);
  P();E(80,2,12,9);c.fillStyle='#1a1012';c.fill();hl(77,-1,4,3,.5);
  if(o.stun){P();for(let a=0;a<12;a+=.5){const r=a*.9;a?c.lineTo(14+Math.cos(a+T*8)*r,-14+Math.sin(a+T*8)*r):c.moveTo(14,-14)}ST(3)}
  else{P();E(14,-14,9,10);FS('#fff',2.5);P();E(17,-13,5.5,6.5);c.fillStyle='#1a1012';c.fill();P();E(15.5,-16,2,2);c.fillStyle='#fff';c.fill()}
  P();c.moveTo(1,-31);c.lineTo(27,o.mad?-22:-27);ST(5);
  if(o.mouth==='open'){P();c.moveTo(38,22);c.quadraticCurveTo(58,48,76,22);c.closePath();FS('#a3263a',3);P();c.moveTo(48,24);c.lineTo(52,31);c.lineTo(56,24);c.fillStyle='#fff';c.fill()}
  else{P();c.moveTo(44,22);c.quadraticCurveTo(58,31,72,20);ST(3.5)}
  c.restore();c.restore()}
function bArm(x,y,a,side,o){c.save();c.translate(x,y);c.rotate(side*a);P();rr(-21,-12,42,112,21);FS(BF,4.5);P();E(0,100,27,24);FS(BF,4);P();E(0,106,14,10);c.fillStyle=BMZ;c.fill();
  if(o)o();c.restore()}
function bearHead(o){o=o||{};
  P();E(-52,-46,24,24);E(52,-46,24,24);FS(BF,4.5);P();E(-52,-46,12,12);E(52,-46,12,12);c.fillStyle='#8a6a5c';c.fill();
  P();E(0,0,72,63);FS(BF,4.5);hl(-30,-30,18,10,.08);
  P();E(0,24,38,28);FS(BMZ,4);P();E(0,10,14,10);c.fillStyle='#1a1012';c.fill();hl(-4,7,5,3,.5);
  if(o.stun){[-26,26].forEach(x=>{P();for(let a=0;a<12;a+=.5){const r=a*.85;a?c.lineTo(x+Math.cos(a+T*8)*r,-14+Math.sin(a+T*8)*r):c.moveTo(x,-14)}ST(3)})}
  else eyes(-26,26,-14,11,o.lx||0,o.ly||0,{angry:o.mad,squeeze:o.ouch,closed:o.happy});
  if(o.mouth==='open'){P();c.moveTo(-18,32);c.quadraticCurveTo(0,58,18,32);c.closePath();FS('#a3263a',3)}
  else if(o.mouth==='o'){P();E(0,40,8,9);FS('#a3263a',3)}
  else{P();c.moveTo(-14,34);c.quadraticCurveTo(0,44,14,34);ST(3.5)}}
function bearFront(x,y,s,o){o=o||{};c.save();c.translate(x,y);c.scale(s,s);
  if(!o.noLegs){P();E(-52,-14,38,22);E(52,-14,38,22);FS(BF,4);P();E(-52,-12,20,12);E(52,-12,20,12);c.fillStyle=BMZ;c.fill()}
  bArm(-76,-160,o.aL==null?.35:o.aL,1,o.holdL);bArm(76,-160,o.aR==null?.35:o.aR,-1,o.holdR);
  P();E(0,-110,92,100);FS(BF,4.5);P();E(0,-96,56,62);c.fillStyle=BBL;c.fill();
  P();c.moveTo(-52,-200);c.quadraticCurveTo(0,-178,52,-200);c.lineTo(0,-146);c.closePath();FS(BAND,3.5);
  c.save();c.translate(0,-250);if(o.tilt)c.rotate(o.tilt);bearHead(o);c.restore();
  c.restore()}
function bearPaw(x,y,s,a){c.save();c.translate(x,y);c.scale(s,s);c.rotate(a||0);P();rr(-26,0,52,150,24);FS(BF,4.5);P();E(0,0,34,30);FS(BF,4.5);P();E(0,6,18,13);c.fillStyle=BMZ;c.fill();
  [-20,-7,7,20].forEach((cx,i)=>{P();E(cx,-22+Math.abs(i-1.5)*3,7,6);c.fillStyle=BMZ;c.fill();P();c.moveTo(cx-3,-28+Math.abs(i-1.5)*3);c.lineTo(cx,-38+Math.abs(i-1.5)*3);c.lineTo(cx+3,-28+Math.abs(i-1.5)*3);c.fillStyle='#eee';c.fill()});c.restore()}

/* ---------- Rýchlíci (lumíci) ---------- */

    else say('Ahoj '+NM[PL].N+'! Ťukni na blikajúci kruh.')}

function drawMap(dt){MT+=dt;backdrop(0,MT*6,560);groundStrip(0,MT*6,560);c.fillStyle='rgba(20,30,20,.25)';c.fillRect(0,0,VW,VH);mapPos();const sv=SAVE[PL],n=doneCount(PL);const pw=(VW-40)/4;
  for(let ch=0;ch<4;ch++){const x=20+pw*(ch+.5);P();rr(x-pw/2+6,128,pw-12,VH-140,24);c.fillStyle=['rgba(120,190,255,.25)','rgba(80,160,90,.28)','rgba(90,170,230,.28)','rgba(230,170,90,.28)'][ch];c.fill();chIcon(ch,x,165)}
  P();MAPP.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.lineWidth=14;c.strokeStyle='rgba(255,250,235,.75)';c.lineCap='round';c.lineJoin='round';c.setLineDash([2,26]);c.stroke();c.setLineDash([]);
  MAPP.forEach((q,i)=>{const open=i<=n,cur=i===Math.min(n,LV.length-1),L=LV[i],boss=L.m==='boss';const r=boss?52:44;

      if(L.side==='bear'){c.scale(rr2*.0105,rr2*.0105);bearHead({mad:boss})}else{c.scale(rr2*.012,rr2*.012);lem(0,45,1.1,{col:i%4,mouth:boss?'grin':null})}c.restore();

      if(L.m==='run'){c.save();c.translate(rr2*.7,rr2*.62);c.scale(.5,.5);P();c.moveTo(-26,-14);c.lineTo(10,-14);c.lineTo(10,-28);c.lineTo(34,0);c.lineTo(10,28);c.lineTo(10,14);c.lineTo(-26,14);c.closePath();FS('#7ee08a',4);c.restore()}},
      {id:'lv'+i,pulse:cur&&open&&!sv.st[i],col:!open?'#c9c2b4':boss?'#ffd9a8':L.side==='bear'?'#e8d9c8':'#fff0c8'});
    if(boss&&open){P();E(q.x,q.y,r+8,r+8);ST(5,'#e24a3b')}
    btns[btns.length-1].fn=()=>{if(open)startLevel(i);else{SFX.lose()}};

  const sc=score(PL);const cx=VW/2;P();rr(cx-200,16,400,92,40);c.fillStyle='rgba(30,20,12,.55)';c.fill();

  if(n>=LV.length)button(cx,62,40,'cup',()=>goFinal(),{pulse:1,is:.011,col:'#fff6c8'});else icon('cup',cx,60,.75);
  button(62,58,42,'home',()=>{hush();go('select');say('Kto ide hrať?')},{is:.011});sndBtn()}
/* --- výsledok --- */
const STW=['','jednu hviezdičku','dve hviezdičky','tri hviezdičky'];
function goResult(win){const g=G,sv=SAVE[PL];let st=0;
  if(win){if(g.easy)st=3;
    else if(g.mode==='run'&&g.side==='bear'){const r=(g.F-g.kx)/(g.F-g.gap0);st=r>.3?3:r>.12?2:1}
    else if(g.mode==='def'){const r=g.items/g.max;st=r>=.8?3:r>=.5?2:1}
    else if(g.mode==='boss')st=g.hearts>=4?3:g.hearts>=2?2:1;
    else st=g.hearts>=3?3:g.hearts>=2?2:1;
    sv.st[g.i]=Math.max(sv.st[g.i]||0,st);store()}
  R={i:g.i,win,st,t:0,side:g.side,ch:g.ch,shown:0};go('result');hush();G=null;
  const who=R.side==='bear'?'Bodo':'Rýchlíci';
  let s=win?'Hurá! '+who+' získava '+STW[st]+'!':'Nevadí, skúsime to znova!';
  if(win&&R.i===LV.length-1&&doneCount(PL)>=LV.length){s+=' To bola posledná úroveň! Poďme na odovzdávanie pohára!'}
  say(s)}
function drawResult(dt){R.t+=dt;backdrop(R.ch,R.t*10,600);groundStrip(R.ch,R.t*10,600);const cx=VW/2,gy=VH*.9;
  const bw=R.win===(R.side==='bear');
  bearFront(cx-240,gy,.62,bw?{aL:2.6,aR:2.6,happy:1,mouth:'open'}:{aL:.3,aR:2.2,mouth:'o',stun:!bw&&R.t%3<1.5});
  for(let k=0;k<3;k++)lem(cx+150+k*90,gy-(k%2)*14,1.2,{col:k,ph:k,dance:!bw,arms:!bw?'up':null,mouth:!bw?'grin':'o',dir:-1,scared:bw});
  if(R.win){for(let k=0;k<3;k++){const ap=R.t-.5-k*.45;if(ap<0){icon('starOff',cx-110+k*110,130,1.05);continue}
      if(k<R.st&&R.shown<=k){R.shown=k+1;SFX.star();stars(cx-110+k*110,130,6)}
      const sc=k<R.st?1.05+Math.max(0,.4-ap)*1.2:1.05;icon(k<R.st?'star':'starOff',cx-110+k*110,130,sc,k<R.st?Math.sin(T*2+k)*.08:0)}
    if(R.t>.4&&R.t<.45)confetti(30)}
  drawFX();
  const by=VH*.42;const nxt=R.win&&R.i+1<LV.length,fin=R.win&&R.i===LV.length-1&&doneCount(PL)>=LV.length;
  button(cx-(nxt||fin?150:90),by,54,'home',()=>{hush();goMap()},{is:.014});
  button(cx+(nxt||fin?0:90),by,54,'replay',()=>startLevel(R.i),{is:.014,pulse:!R.win});
  if(nxt)button(cx+150,by,60,'next',()=>startLevel(R.i+1),{is:.016,pulse:1});
  if(fin)button(cx+150,by,60,'cup',()=>goFinal(),{is:.012,pulse:1,col:'#fff6c8'});
  sndBtn()}
/* --- finále --- */
function goFinal(){go('final');R={t:0};const sc=score(PL);SAVE[PL].fin=1;store();
  const w=sc.b>sc.l?'Medveď Bodo':sc.l>sc.b?'Rýchlíci':null;
  say('Veľké finále súťaže! Bodo má '+sc.b+' hviezdičiek a Rýchlíci '+sc.l+'. '+(w?'Zlatý pohár vyhrávajú '+w+'!':'Je to remíza, pohár si rozdelia!')+' A potom spolu urobili veľkú hostinu pri jazere. '+NM[PL].N+', si šampión!');SFX.win();confetti(80)}
function drawFinal(dt){R.t+=dt;backdrop(0,0,600);groundStrip(0,0,600);cabin(VW*.15,600,.45);const sc=score(PL),cx=VW/2,gy=VH*.88;

/* ================= SLUČKA ================= */
let last=0,slow=0;
function drawIcon(){backdrop(0,0,640);groundStrip(0,0,640);bearSide(VW*.08,780,1.15,{ph:1,mouth:'open',mad:1});kart(VW*.72,700,1.5,{cheer:1});icon('cup',VW*.5,170,1.6)}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;btns=[];c.setTransform(S,0,0,S,0,0);
  if(dt>.034&&scr==='play'){slow+=dt;if(slow>2.5&&qual>1){qual=Math.max(1,qual-.5);resize();slow=0}}else slow=Math.max(0,slow-dt*.5);
  try{updFX(dt);
    if(location.hash==='#icon')drawIcon();
    else if(scr==='splash'){drawSplash();drawFX()}
    else if(scr==='select'){drawSelect();drawFX()}
    else if(scr==='map'){drawMap(dt);drawFX()}
    else if(scr==='play'){const m=G.mode;if(m==='run'){updRun(dt);if(scr==='play')drawRun()}else if(m==='def'){updDef(dt);if(scr==='play')drawDef(dt)}else{updBoss(dt);if(scr==='play')drawBoss()}}
    else if(scr==='result')drawResult(dt);
    else if(scr==='final')drawFinal(dt);
  }catch(e){console.error(e)}
  if(fade>0){fade=Math.max(0,fade-dt*3);c.fillStyle='rgba(255,255,255,'+fade+')';c.fillRect(0,0,VW,VH)}
  musicTick()}
function toV(e){return {x:e.clientX*DPR/S,y:e.clientY*DPR/S,id:e.pointerId}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(hyp(b.x-p.x,b.y-p.y)<b.r)return b}return null}
function playDown(p){if(!G||G.wait)return;if(G.mode==='run')runDown(p);else if(G.mode==='def')defDown(p);else bossDown(p)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toV(e);const b=hitBtn(p);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(b){press={id:b.id,fn:b.fn,x:b.x,y:b.y,r:b.r,pid:e.pointerId};return}
  if(scr==='play')playDown(p)});
cv.addEventListener('pointermove',e=>{if(scr==='play'&&G&&!G.wait){const p=toV(e);if(G.mode==='run')runMove(p);else if(G.mode==='boss')bossMove(p)}});
function upEv(e){const p=toV(e);prime();if(press&&press.pid===e.pointerId){const pr=press;press=null;if(hyp(pr.x-p.x,pr.y-p.y)<pr.r+30){SFX.tap();pr.fn()}return}
  if(scr==='play'&&G){if(G.mode==='run')runUp(p);else if(G.mode==='boss')bossUp(p)}}
cv.addEventListener('pointerup',upEv);
cv.addEventListener('pointercancel',e=>{press=null;if(G&&scr==='play'){if(G.mode==='run')runUp(toV(e));else if(G.mode==='boss')bossUp()}});
addEventListener('touchend',()=>{ac();prime()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(G&&scr==='play'&&!G.end)G.wait=true;if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
const FSC={on:()=>document.fullscreenElement||document.webkitFullscreenElement,can:()=>document.fullscreenEnabled||document.webkitFullscreenEnabled,land:()=>innerWidth>innerHeight};
function fsGo(){if(!FSC.can()||FSC.on()||!FSC.land())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
['pointerup','touchend'].forEach(ev=>addEventListener(ev,fsGo,true));
resize();requestAnimationFrame(frame);
window.__T={dropTrap,defDown,bossDown,upd:dt=>{const m=G.mode;if(m==='run')updRun(dt);else if(m==='def')updDef(dt);else updBoss(dt)},get G(){return G},get R(){return R},go,goMap,startLevel,begin,goResult,goFinal,setPL:p=>{PL=p},scr:()=>scr,SAVE:()=>SAVE};
