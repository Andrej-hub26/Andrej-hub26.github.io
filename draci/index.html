<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

#rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:#9fd6ff;display:none;align-items:center;justify-content:center}
#rot .ph{width:80px;height:136px;border:8px solid #2b2340;border-radius:18px;background:#fff;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:1100px){#rot{display:flex}}

<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div></div>
<script>
'use strict';
/* ===== Dračí let – hra pre Maťka a Adamka ===== */
const cv=document.getElementById('c'),c=cv.getContext('2d');
const VH=720,PI=Math.PI,TAU=PI*2,OL='#2b2340';
let VW=1280,S=1,DPR=1,qual=2,T=0,scr='splash',fade=1,btns=[],press=null,PL=null,G=null,R=null,CV=null,MT=0;
const FX=[];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],hyp=Math.hypot,lerp=(a,b,t)=>a+(b-a)*t;
let GR={};
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(window.devicePixelRatio||1,qual);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';S=cv.height/VH;VW=cv.width/S;GR={}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- ukladanie ---------- */
const KEY='draciLet.v1';
const blankP=()=>({lv:{},dr:[0],sel:0,gems:0,tut:0});
const blank=()=>({snd:1,matko:blankP(),adamko:blankP()});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.matko&&s.adamko)return s}catch(e){}return blank()}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}
const NM={matko:{N:'Maťko',D:'Maťkovi'},adamko:{N:'Adamko',D:'Adamkovi'}};
const tx=s=>s.replace(/\{N\}/g,NM[PL].N).replace(/\{D\}/g,NM[PL].D);

/* ---------- hlas ---------- */
let skV=null,sayTok=0,lastSayAt=-9;
function pickV(){try{const vs=speechSynthesis.getVoices();skV=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,cb){const tok=++sayTok;let done=false;lastSayAt=T;const fin=()=>{if(done||tok!==sayTok)return;done=true;if(cb)cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skV)u.voice=skV;u.rate=1;u.pitch=1.1;u.onend=()=>setTimeout(fin,250);speechSynthesis.speak(u)}catch(e){}
  if(cb)setTimeout(fin,1800+t.length*95)}
function speaking(){try{return speechSynthesis.speaking}catch(e){return false}}
function sayQ(t,force){if(force||(!speaking()&&T-lastSayAt>1.4))say(t)}
function hush(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let primed=false;function prime(){if(primed)return;primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const PRAISE=['Super!','Výborne!','Bravó!','Trafil si!','Si šikovný!','Paráda!','Jupí!','Skvelé!'];

/* ---------- zvuky a hudba ---------- */
let AC=null,OUT=null,MUS=null,NB=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=1;MUS.connect(OUT)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,f2,delay,dest){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05)}
function noise(d,f,q,vol,f2,delay){const a=AC;if(!a||a.state!=='running')return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=a.currentTime+(delay||0),s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(OUT);s.start(t);s.stop(t+d+.05)}catch(e){}}
let fireN=0;
const SFX={
  tap(){tone(700,.08,'sine',.18,900)},
  fire(){if(++fireN%2)noise(.22,1600,.9,.12,500)},
  big(){noise(.4,1100,.7,.3,280);tone(220,.3,'sawtooth',.05,90)},
  ring(){tone(988,.14,'triangle',.16);tone(1319,.22,'triangle',.16,0,.08);tone(1976,.18,'sine',.06,0,.16)},
  gem(){tone(1568,.1,'sine',.15);tone(2093,.16,'sine',.12,0,.07)},
  puff(){tone(480,.16,'sine',.28,1300);tone(1500,.12,'triangle',.08,2300,.07)},
  hit(){tone(330,.07,'square',.05,220)},
  hurt(){tone(320,.35,'sawtooth',.12,90)},
  bonk(){tone(520,.14,'sine',.22,260);tone(780,.1,'sine',.1,390,.08)},
  roar(){noise(.9,380,.6,.35,140);tone(120,.8,'sawtooth',.1,70)},
  boost(){noise(.7,500,.6,.22,2600);tone(400,.5,'triangle',.1,1200)},
  heart(){[660,880,1320].forEach((f,i)=>tone(f,.14,'sine',.16,0,i*.08))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.18,0,i*.12))},
  crack(){noise(.07,3200,2,.35);noise(.06,2500,2,.25,0,.09)},
  hatch(){[523,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,'triangle',.15,0,i*.07));noise(.3,4000,1,.1)},
  laugh(){[300,260,300,240].forEach((f,i)=>tone(f,.12,'square',.05,f*.8,i*.13))},
  wrong(){tone(330,.16,'sine',.18);tone(250,.3,'sine',.18,0,.16)},
  star(){tone(1320,.3,'sine',.16,1980)}
};
const MEL={menu:[0,4,7,12,11,7,4,-1,5,9,12,9,7,4,2,-1],play:[0,7,12,7,3,7,10,7,5,9,12,9,7,11,14,11]};
let musStep=0,musNext=0;
function musicTick(){if(!AC||AC.state!=='running'||!SAVE.snd)return;const pl=scr==='play'&&G&&G.phase!=='lose',m=pl?MEL.play:MEL.menu,spb=pl?.17:.26;MUS.gain.value=speaking()?.3:1;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){const n=m[musStep%16],d=musNext-AC.currentTime;if(n>=0)tone(392*Math.pow(2,n/12),spb*.85,'triangle',.03,0,d,MUS);
    if(musStep%4===0){const bs=pl?[0,-4,-2,-5][(musStep>>2)%4]:[0,-7,-3,-5][(musStep>>2)%4];tone(98*Math.pow(2,bs/12),spb*3.5,'sine',.06,0,d,MUS)}
    musStep++;musNext+=spb}}

/* ---------- kresliace pomôcky ---------- */
function P(){c.beginPath()}
function E(x,y,rx,ry){c.moveTo(x+rx,y);c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,TAU)}
function FS(f,lw){c.fillStyle=f;c.fill();if(lw!==0){c.lineWidth=lw||4;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(R,r){P();for(let k=0;k<10;k++){const a=-PI/2+k*PI/5,q=k%2?r:R;k?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
function hl(x,y,rx,ry,a){P();E(x,y,rx,ry);c.fillStyle='rgba(255,255,255,'+(a||.4)+')';c.fill()}
function eyes(x1,x2,y,er,lx,ly,o){o=o||{};[x1,x2].forEach((x,i)=>{
  if(o.blink||o.closed){P();c.moveTo(x-er,y+(o.closed?er*.3:0));c.quadraticCurveTo(x,y+er*(o.closed?-.7:.4),x+er,y+(o.closed?er*.3:0));c.lineWidth=Math.max(3,er*.3);c.strokeStyle=OL;c.lineCap='round';c.stroke();return}
  if(o.dizzy){P();for(let a=0;a<TAU*2;a+=.4){const q=er*a/(TAU*2);const px=x+Math.cos(a+T*8)*q,py=y+Math.sin(a+T*8)*q;a?c.lineTo(px,py):c.moveTo(px,py)}c.lineWidth=Math.max(2,er*.2);c.strokeStyle=OL;c.stroke();return}
  P();E(x,y,er,er*1.18);FS('#fff',Math.max(2,er*.22));
  P();E(x+lx*er*.38,y+ly*er*.42,er*.56,er*.64);c.fillStyle=o.iris||'#20141c';c.fill();
  P();E(x+lx*er*.38,y+ly*er*.42,er*.3,er*.36);c.fillStyle='#120b16';c.fill();
  P();E(x+lx*er*.38-er*.17,y+ly*er*.42-er*.22,er*.17,er*.17);c.fillStyle='#fff';c.fill();
  if(o.angry){P();const s=i?-1:1;c.moveTo(x-s*er*1.1,y-er*1.6);c.lineTo(x+s*er*.9,y-er*.9);c.lineWidth=er*.38;c.strokeStyle=OL;c.lineCap='round';c.stroke()}})}
function txt(s,x,y,size,col,al,lw){c.font='800 '+size+'px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';if(lw!==0){c.lineWidth=lw||size*.22;c.strokeStyle=OL;c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function puffs(B,col,lw){P();B.forEach(b=>E(b[0],b[1],b[2],b[3]));if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}c.fillStyle=col;c.fill()}

/* ---------- draci ---------- */
const DR=[
  {n:'Iskra',b:'#ff7a2f',d:'#c9461a',w:'#ffb347',bl:'#ffe1a8',sp:'#ffd23f',h:'#fff1c9',eye:'#2f9a3e',fire:['#fff6b0','#ffb52e','#ff4e1f']},
  {n:'Zelenko',b:'#4cc35a',d:'#2a7f39',w:'#a6e36a',bl:'#eaf8bf',sp:'#ffcf3a',h:'#f4ffd8',eye:'#7a3fbf',fire:['#f6ffb0','#b6f04a','#3fbf3a']},
  {n:'Ľadík',b:'#8fd3ff',d:'#4a8fcf',w:'#dff3ff',bl:'#ffffff',sp:'#ffffff',h:'#ffffff',eye:'#2a5fbf',fire:['#ffffff','#c5ecff','#5cc3ff']},
  {n:'Fialka',b:'#a66be0',d:'#6b3aa8',w:'#f5a3d8',bl:'#f6dcff',sp:'#ffd23f',h:'#fbe9ff',eye:'#e0457b',fire:['#fff0ff','#ff9be0','#d84ad6']},
  {n:'Zlaťák',b:'#ffcf3a',d:'#c98d12',w:'#fff09a',bl:'#fff8d6',sp:'#ff8a2a',h:'#fffbe6',eye:'#c0392b',fire:['#ffffff','#fff07a','#ffb300']},
  {n:'Uhlík',b:'#4a4560',d:'#25222f',w:'#e8553a',bl:'#8a84a6',sp:'#ff7a2f',h:'#b7b2d0',eye:'#ffb300',fire:['#ffffff','#7fd4ff','#3a6dff']},
  {n:'Dúhovec',b:'#ff6fae',d:'#b43a7a',w:'rain',bl:'#fff2f8',sp:'#4fc3ff',h:'#fff6fb',eye:'#6a3ad6',fire:'rain',rain:1}
];
const RAINC=['#ff4d6d','#ff9b22','#ffd23f','#4cc35a','#45a6ee','#a35bd6'];
function fireCols(D){if(D.fire!=='rain')return D.fire;const k=Math.floor(T*6)%6;return ['#ffffff',RAINC[k],RAINC[(k+2)%6]]}
function wingFill(D,x0,y0,x1,y1){if(D.w!=='rain')return D.w;const g=c.createLinearGradient(x0,y0,x1,y1);RAINC.forEach((col,i)=>g.addColorStop(i/5,col));return g}

function dragonFront(x,y,s,D,o){o=o||{};c.save();c.translate(x,y);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  const fl=Math.sin((o.ft!=null?o.ft:T)*5),tw=Math.sin(T*2)*6;
  P();c.moveTo(20,64);c.bezierCurveTo(84,86,116,44,100,8+tw);c.bezierCurveTo(94,44,70,62,28,44);c.closePath();FS(D.b,4);
  P();c.moveTo(91,12+tw);c.lineTo(102,-14+tw);c.lineTo(116,8+tw);c.lineTo(102,4+tw);c.closePath();FS(D.sp,3.5);
  for(const sd of [-1,1]){c.save();c.translate(sd*30,-2);c.scale(sd,1);c.rotate(-.2-fl*.2);
    P();c.moveTo(0,0);c.quadraticCurveTo(30,-74,98,-88);c.quadraticCurveTo(90,-60,106,-38);c.quadraticCurveTo(82,-38,80,-14);c.quadraticCurveTo(60,-20,56,4);c.quadraticCurveTo(30,-4,4,22);c.closePath();FS(wingFill(D,0,-80,90,10),4);
    c.lineWidth=3.5;c.strokeStyle=D.d;P();c.moveTo(6,4);c.lineTo(96,-84);c.moveTo(42,-42);c.lineTo(104,-39);c.moveTo(38,-34);c.lineTo(80,-15);c.moveTo(30,-24);c.lineTo(56,3);c.stroke();c.restore()}
  for(const sd of [-1,1]){P();E(sd*26,96,21,12);FS(D.d,4);P();E(sd*26-9,92,3.5,3.5);E(sd*26,90,3.5,3.5);E(sd*26+9,92,3.5,3.5);c.fillStyle='#fff';c.fill()}
  P();E(0,50,50,52);FS(D.b,4.5);
  P();E(0,58,31,40);FS(D.bl,3);
  c.save();c.globalAlpha=.3;c.strokeStyle=D.d;c.lineWidth=3;P();for(let k=0;k<4;k++){const yy=34+k*15,w=Math.sqrt(Math.max(0,1-Math.pow((yy-58)/40,2)))*29;c.moveTo(-w,yy);c.quadraticCurveTo(0,yy+7,w,yy)}c.stroke();c.restore();
  if(o.wave){P();c.save();c.translate(44,30);c.rotate(-.9+Math.sin(T*8)*.35);E(0,-16,11,19);c.restore();FS(D.b,4);P();E(-46,54,11,17);FS(D.b,4)}
  else{P();E(-46,54,11,17);E(46,54,11,17);FS(D.b,4)}
  for(const sd of [-1,1]){P();c.moveTo(sd*48,-60);c.lineTo(sd*80,-76);c.lineTo(sd*58,-34);c.closePath();FS(wingFill(D,-60,-80,60,-30),3.5)}
  for(const sd of [-1,1]){P();c.moveTo(sd*16,-80);c.quadraticCurveTo(sd*28,-114,sd*46,-122);c.quadraticCurveTo(sd*36,-98,sd*36,-74);c.closePath();FS(D.h,3.5)}
  P();c.moveTo(-11,-84);c.lineTo(0,-106);c.lineTo(11,-84);c.closePath();FS(D.sp,3.5);
  P();E(0,-46,56,46);FS(D.b,4.5);hl(-24,-72,14,7,.3);
  P();E(0,-20,34,22);FS(D.h,4);
  P();E(-10,-27,4,3);E(10,-27,4,3);c.fillStyle=D.d;c.fill();
  eyes(-23,23,-56,15,o.lx||0,o.ly!=null?o.ly:.1,{iris:D.eye,blink:!o.angry&&(T*1.1+(o.bk||0))%3.6<.12,angry:o.angry,closed:o.happy===2,dizzy:o.dizzy});
  P();E(-40,-32,9,6);E(40,-32,9,6);c.fillStyle='rgba(255,110,140,.45)';c.fill();
  if(o.angry){P();c.moveTo(-14,-8);c.quadraticCurveTo(0,-17,14,-8);c.lineWidth=4;c.strokeStyle=OL;c.stroke()}
  else if(o.open){P();E(0,-9,13,10);FS('#8a1f35',3.5);P();E(0,-4,7,4);c.fillStyle='#ff7f9a';c.fill()}
  else{P();c.moveTo(-16,-13);c.quadraticCurveTo(0,0,16,-13);c.lineWidth=4;c.strokeStyle=OL;c.stroke();P();c.moveTo(-9,-9);c.lineTo(-6,-3);c.lineTo(-3,-8);c.closePath();FS('#fff',2)}
  c.restore()}

function dragonBack(x,y,s,D,o){o=o||{};c.save();c.translate(x,y);c.rotate((o.bank||0)*.3);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  const fl=Math.sin(o.flap!=null?o.flap:T*9),tw=Math.sin(T*3)*16;
  P();c.moveTo(-13,34);c.quadraticCurveTo(-8,74,tw,94);c.quadraticCurveTo(10,70,13,34);c.closePath();FS(D.b,4);
  P();c.moveTo(tw,88);c.lineTo(tw-15,103);c.lineTo(tw,120);c.lineTo(tw+15,103);c.closePath();FS(D.sp,3.5);
  for(const sd of [-1,1]){c.save();c.translate(sd*22,-14);c.scale(sd,1);c.rotate(-fl*.42);
    P();c.moveTo(0,-2);c.quadraticCurveTo(44,-54,114,-58);c.quadraticCurveTo(104,-30,116,-6);c.quadraticCurveTo(90,-10,82,12);c.quadraticCurveTo(60,2,48,24);c.quadraticCurveTo(26,10,0,20);c.closePath();FS(wingFill(D,0,-50,110,20),4);
    c.lineWidth=4;c.strokeStyle=D.d;P();c.moveTo(4,4);c.lineTo(112,-56);c.moveTo(44,-26);c.lineTo(114,-8);c.moveTo(38,-18);c.lineTo(82,10);c.moveTo(28,-8);c.lineTo(48,22);c.stroke();c.restore()}
  P();E(0,10,34,44);FS(D.b,4.5);
  P();E(0,10,16,36);c.fillStyle=D.d;c.globalAlpha=.25;c.fill();c.globalAlpha=1;
  for(let k=0;k<5;k++){const yy=-22+k*14,w=9-k;P();c.moveTo(-w,yy+6);c.lineTo(0,yy-8);c.lineTo(w,yy+6);c.closePath();FS(D.sp,3)}
  for(const sd of [-1,1]){P();E(sd*30,40,12,10);FS(D.d,3.5)}
  const hx=(o.bank||0)*8;
  for(const sd of [-1,1]){P();c.moveTo(hx+sd*24,-50);c.lineTo(hx+sd*44,-58);c.lineTo(hx+sd*28,-36);c.closePath();FS(wingFill(D,-40,-60,40,-30),3.5)}
  for(const sd of [-1,1]){P();c.moveTo(hx+sd*10,-62);c.quadraticCurveTo(hx+sd*20,-92,hx+sd*34,-98);c.quadraticCurveTo(hx+sd*26,-78,hx+sd*24,-56);c.closePath();FS(D.h,3.5)}
  P();E(hx,-46,27,24);FS(D.b,4.5);hl(hx-8,-58,9,5,.35);
  P();c.moveTo(hx-6,-66);c.lineTo(hx,-78);c.lineTo(hx+6,-66);c.closePath();FS(D.sp,3);
  if(o.fire>0){const fc=fireCols(D),r=18*o.fire;P();E(hx,-78,r*1.3,r*1.1);c.fillStyle=fc[2];c.globalAlpha=.6;c.fill();c.globalAlpha=1;P();E(hx,-78,r*.8,r*.7);c.fillStyle=fc[1];c.fill();P();E(hx,-78,r*.4,r*.35);c.fillStyle=fc[0];c.fill()}
  c.restore()}

function egg(x,y,s,D,o){o=o||{};c.save();c.translate(x,y);c.rotate(o.rot||0);c.scale(s,s);

function updPlay(dt){const g=G,D=g.D,e=g.easy;g.t+=dt;g.pt+=dt;g.shake=Math.max(0,g.shake-dt);g.hintT-=dt;g.tapCd-=dt;g.boost=Math.max(0,g.boost-dt);

    const st=sv.lv[i]||0;for(let k=0;k<3;k++)icon(k<st?'star':'starOff',x-34+k*34,y+r*1.05+16,.3)});
  const cp=ISL[cur],cx=cp[0]*VW,cy=cp[1]*VH;dragonFront(cx+r*.95,cy-r*.75+Math.sin(T*3)*8,.42,DRA(),{wave:1});
  homeBtn(()=>go('select'));sndBtn();
  button(VW-160,58,40,'cave',()=>goCave(),{is:.011,pulse:sv.dr.length>1&&!sv.seenCave});
  icon('gem',150,60,.42);txt(String(sv.gems||0),182,62,34,'#fff','left')}
/* --- dračia jaskyňa --- */
function goCave(){go('cave');const sv=SAVE[PL];sv.seenCave=1;store();CV={pop:-1,pt:0};say(sv.dr.length>1?'Dračia jaskyňa! Ťukni na dráčika, s ktorým chceš lietať.':'Dračia jaskyňa. Zatiaľ tu je len Iskra. Zachráň vajíčka a vyliahnu sa noví dráčikovia!')}
function drawCave(dt){CV.pt+=dt;softBg('#3b2a4e','#7a5a6e');const sv=SAVE[PL];
  c.fillStyle='rgba(0,0,0,.18)';P();for(let k=0;k<9;k++){const x=k/8*VW;c.moveTo(x-50,0);c.lineTo(x,70+(k%3)*30);c.lineTo(x+50,0)}c.fill();
  P();E(VW/2,VH+60,VW*.6,170);c.fillStyle='#5a4050';c.fill();
  const n=DR.length,cols=4,cw=Math.min(250,(VW-80)/cols),ch=Math.min(270,(VH-150)/2);
  DR.forEach((D,i)=>{const row=i<4?0:1,ci=row?i-4:i,cnt=row?3:4,x=VW/2+(ci-(cnt-1)/2)*cw,y=150+ch*.5+row*ch;const have=sv.dr.indexOf(i)>=0,sel=sv.sel===i;
    P();E(x,y+ch*.3,cw*.36,ch*.08);c.fillStyle='rgba(0,0,0,.25)';c.fill();
    if(sel){P();E(x,y,cw*.44,ch*.46);c.fillStyle='rgba(255,207,58,.25)';c.fill();c.lineWidth=5;c.strokeStyle='#ffcf3a';c.stroke()}
    if(have){const b=CV.pop===i?1+Math.max(0,.3-CV.pt)*1.2:1;dragonFront(x,y+ch*.02,Math.min(cw,ch)/330*b,D,{bk:i,wave:sel})}else egg(x,y+ch*.12,Math.min(cw,ch)/190,D,{grey:1,q:1,rot:Math.sin(T*2+i)*.06});
    btns.push({x,y,r:Math.min(cw,ch)*.45,id:'dr'+i,fn:()=>{if(have){sv.sel=i;store();CV.pop=i;CV.pt=0;SFX.roar();say('Dráčik '+D.n+'! Poletíme spolu!')}else{SFX.wrong();say('Toto vajíčko sa ešte nevyliahlo. Zachráň ho na ostrove!')}}})});
  homeBtn(()=>goMap());sndBtn()}
/* --- výsledok --- */
function goResult(){const g=G,i=g.i,easy=g.easy,sv=SAVE[PL];let st=3;if(!easy){st=1;if(g.hurtN<=2)st++;if(g.ringsTot&&(g.ringsGot||0)/g.ringsTot>=.6)st++}
  const old=sv.lv[i]||0;sv.lv[i]=Math.max(old,st);sv.gems=(sv.gems||0)+g.gemN;const rw=g.L.rew,isNew=sv.dr.indexOf(rw)<0;if(isNew)sv.dr.push(rw);store();
  R={i,st,rw,isNew,t:0,hatched:false,th:g.th};go('result');G=null;say(easy?'Hurá! Vajíčko je zachránené! Pozri, praská!':'Hurá! Vajíčko je zachránené! Pozri, praská!')}
function drawResult(dt){R.t+=dt;const th=R.th,D=DR[R.rw];softBg(th.s1,th.s2);for(const k of SKYC){k.x-=k.v*.016;if(k.x<-.15)k.x=1.15;skyCloud(k.x*VW,k.y*VH,k.s*.8,th.night?.3:.8)}
  const cx=VW/2,cy=VH*.44;P();E(cx,cy+150,170,30);c.fillStyle='rgba(0,0,0,.12)';c.fill();
  if(R.t<2.6){const cr=clamp((R.t-.6)/1.8,0,1),wob=Math.sin(R.t*(8+cr*16))*(.08+cr*.18);egg(cx,cy+40,2.2,D,{rot:wob,crack:cr});
    if(R.t>.8&&Math.floor(R.t*4)!==Math.floor((R.t-dt)*4))SFX.crack()}
  else{if(!R.hatched){R.hatched=true;SFX.hatch();burst(cx,cy,'#fff',24,500);confetti(80);stars(cx,cy,10);
      say(R.isNew?'Vyliahol sa dráčik '+D.n+'! Nájdeš ho v dračej jaskyni.':'Dráčik '+D.n+' ti máva! Výborne!')}
    const pop=clamp((R.t-2.6)*3,0,1),s=1.15*(.5+.5*pop)+Math.sin(T*3)*.02;dragonFront(cx,cy+10,s,D,{wave:1,open:Math.sin(T*4)>.6});
    for(let k=0;k<3;k++){const a=clamp((R.t-3-k*.35)*3,0,1);if(a>0)icon(k<R.st?'star':'starOff',cx-110+k*110,VH*.12,.8*(a<1?a*1.3:1))}
    if(R.t>3.4){button(cx-200,VH*.86,64,'home',()=>{hush();goMap()},{is:.015});button(cx,VH*.86,64,'replay',()=>{hush();startLevel(R.i)},{is:.015});
      if(R.i<LV.length-1)button(cx+200,VH*.86,78,'next',()=>{hush();startLevel(R.i+1)},{is:.018,pulse:1});else button(cx+200,VH*.86,72,'cave',()=>{hush();goCave()},{is:.016,pulse:1})}}
  drawFX();updFX(dt)}

/* ================= SLUČKA ================= */
let last=0,slow=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;btns=[];c.setTransform(S,0,0,S,0,0);
  if(dt>.034&&scr==='play'){slow+=dt;if(slow>2.5&&qual>1){qual=Math.max(1,qual-.5);resize();slow=0}}else slow=Math.max(0,slow-dt*.5);
  try{
    if(location.hash==='#icon'){softBg('#5fb6f5','#d4f0ff');skyCloud(VW*.2,VH*.85,1.6,.95);skyCloud(VW*.85,VH*.2,1.1,.9);dragonFront(VW*.5,VH*.52,2.3,DR[0],{});}
    else if(scr==='splash')drawSplash();
    else if(scr==='select')drawSelect();
    else if(scr==='map')drawMap(dt);
    else if(scr==='cave')drawCave(dt);
    else if(scr==='play'){updPlay(dt);if(scr==='play')drawPlay()}
    else if(scr==='result')drawResult(dt);
    if(scr!=='play'&&scr!=='result'){updFX(dt);drawFX()}
  }catch(e){console.error(e)}
  if(fade>0){fade=Math.max(0,fade-dt*3);c.fillStyle='rgba(255,255,255,'+fade+')';c.fillRect(0,0,VW,VH)}
  musicTick()}
function toV(e){return {x:e.clientX*DPR/S,y:e.clientY*DPR/S,id:e.pointerId}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(hyp(b.x-p.x,b.y-p.y)<b.r)return b}return null}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toV(e);const b=hitBtn(p);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(b){press={id:b.id,fn:b.fn,x:b.x,y:b.y,r:b.r,pid:e.pointerId};return}
  if(scr==='play')playDown(p)});
cv.addEventListener('pointermove',e=>{if(scr==='play')playMove(toV(e))});
cv.addEventListener('pointerup',e=>{const p=toV(e);prime();if(press&&press.pid===e.pointerId){const pr=press;press=null;if(hyp(pr.x-p.x,pr.y-p.y)<pr.r+30){SFX.tap();pr.fn()}return}if(scr==='play')playUp(p)});
cv.addEventListener('pointercancel',e=>{press=null;if(G&&G.drag&&G.drag.id===e.pointerId)G.drag=null});
addEventListener('touchend',()=>{ac();prime()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
const FSC={on:()=>document.fullscreenElement||document.webkitFullscreenElement,can:()=>document.fullscreenEnabled||document.webkitFullscreenEnabled,land:()=>innerWidth>innerHeight};
function fsGo(){if(!FSC.can()||FSC.on()||!FSC.land())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
['pointerup','touchend'].forEach(ev=>addEventListener(ev,fsGo,true));
resize();requestAnimationFrame(frame);
window.__T={upd:dt=>updPlay(dt),get G(){return G},get R(){return R},go,goMap,startLevel,goResult,goCave,setPL:p=>{PL=p},scr:()=>scr,SAVE:()=>SAVE,startFinal:()=>{G.phase='fight';G.wave=G.nWaves;G.foes=[];G.waveT=0},toFight:()=>{G.pt=G.flyDur;G.rings=[];G.obst=[]}};
</script>
