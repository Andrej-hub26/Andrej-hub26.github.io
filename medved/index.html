<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Brumko a Pišťúni</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fd6ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
#rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:#9fd6ff;display:none;align-items:center;justify-content:center}
#rot .ph{width:80px;height:136px;border:8px solid #3a2618;border-radius:18px;background:#fff;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:1100px){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div></div>
<script>
'use strict';
/* ===== Brumko a Pišťúni – hra pre Maťka a Adamka ===== */
const cv=document.getElementById('c');let c=cv.getContext('2d');
const VH=720,PI=Math.PI,TAU=PI*2,OL='#3a2618';
let VW=1280,S=1,DPR=1,qual=2,T=0,scr='splash',fade=1,btns=[],press=null,PL=null,G=null,R=null,MT=0;
const FX=[];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],hyp=Math.hypot,lerp=(a,b,t)=>a+(b-a)*t;
let GR={},BGC={};
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(window.devicePixelRatio||1,qual);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';S=cv.height/VH;VW=cv.width/S;GR={};BGC={}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- ukladanie ---------- */
const KEY='brumkoPistuni.v1';
const blankP=()=>({st:{},intro:0});
const blank=()=>({snd:1,matko:blankP(),adamko:blankP()});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.matko&&s.adamko)return s}catch(e){}return blank()}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}
const NM={matko:{N:'Maťko',D:'Maťkovi'},adamko:{N:'Adamko',D:'Adamkovi'}};
const tx=s=>s.replace(/\{N\}/g,PL?NM[PL].N:'');

/* ---------- hlas ---------- */
let skV=null,sayTok=0,lastSayAt=-9;
function pickV(){try{const vs=speechSynthesis.getVoices();skV=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,cb,pitch){const tok=++sayTok;let done=false;lastSayAt=T;const fin=()=>{if(done||tok!==sayTok)return;done=true;if(cb)cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skV)u.voice=skV;u.rate=pitch?.92:1;u.pitch=pitch||1.1;u.onend=()=>setTimeout(fin,250);speechSynthesis.speak(u)}catch(e){}
  if(cb)setTimeout(fin,1800+t.length*95)}
function bearSay(t,cb){say(t,cb,.45)}
function speaking(){try{return speechSynthesis.speaking}catch(e){return false}}
function sayQ(t,force){if(force||(!speaking()&&T-lastSayAt>1.4))say(t)}
function hush(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let primed=false;function prime(){if(primed)return;primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const PRAISE=['Super!','Výborne!','Bravó!','Paráda!','Jupí!','Skvelé!','Si šikovný!'];

/* ---------- zvuky a hudba ---------- */
let AC=null,OUT=null,MUS=null,NB=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=1;MUS.connect(OUT)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,f2,delay,dest){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05)}
function noise(d,f,q,vol,f2,delay){const a=AC;if(!a||a.state!=='running')return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=a.currentTime+(delay||0),s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(OUT);s.start(t);s.stop(t+d+.05)}catch(e){}}
const SFX={
  tap(){tone(700,.08,'sine',.18,900)},
  boo(){tone(150,.38,'sawtooth',.14,90);noise(.32,520,1,.3,180);tone(110,.4,'square',.05,70)},
  squeak(){const f=rnd(1500,1900);tone(f,.32,'sine',.16,f*1.7);tone(f*1.4,.22,'triangle',.06,f*2,.1)},
  giggle(){[1500,1850,1500,1950,1600].forEach((f,i)=>tone(f,.07,'sine',.11,f*1.12,i*.08))},
  pop(){noise(.12,2500,1,.4,700);tone(900,.08,'square',.06,300)},
  boxoff(){tone(300,.12,'square',.06,200);noise(.15,900,1,.2)},
  snore(){noise(1.1,240,3,.13,150)},
  hmm(){tone(170,.3,'triangle',.22,230);tone(230,.3,'triangle',.16,190,.28)},
  crack(){noise(.06,3200,2,.45);noise(.07,2200,2,.35,0,.07);noise(.05,2800,2,.25,0,.15)},
  step(){tone(rnd(1150,1450),.04,'triangle',.05)},
  roar(){noise(.85,380,.6,.38,140);tone(140,.7,'sawtooth',.13,80)},
  slurp(){tone(380,.22,'sine',.16,950);tone(700,.2,'sine',.1,320,.2)},
  steal(){[900,1200,1500].forEach((f,i)=>tone(f,.09,'triangle',.1,0,i*.06))},
  back(){[784,1047,1319].forEach((f,i)=>tone(f,.12,'triangle',.16,0,i*.07))},
  load(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.17,0,i*.08))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.18,0,i*.12))},
  wrong(){tone(330,.16,'sine',.18);tone(250,.3,'sine',.18,0,.16)},
  star(){tone(1320,.3,'sine',.16,1980)}
};
const MEL={menu:[0,4,7,4,5,9,12,-1,7,5,4,2,0,-1,7,-1],guard:[0,-1,7,4,0,-1,9,7,5,-1,9,5,7,4,2,-1],sneak:[0,-1,-1,3,-1,-1,7,-1,5,-1,-1,3,-1,2,-1,-1]};
let musStep=0,musNext=0;
function musicTick(){if(!AC||AC.state!=='running'||!SAVE.snd)return;let m=MEL.menu,spb=.24,typ='triangle',vol=.03;
  if(scr==='play'&&G){if(G.mode==='sneak'){m=MEL.sneak;spb=.2;typ='sine';vol=.05;if(G.bs!=='sleep'||G.ph==='chased'){musNext=AC.currentTime+.1;return}}else{m=MEL.guard;spb=.15}}
  MUS.gain.value=speaking()?.3:1;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){const n=m[musStep%16],d=musNext-AC.currentTime;if(n>=0)tone(392*Math.pow(2,n/12),spb*.7,typ,vol,0,d,MUS);
    if(musStep%4===0){const bs=[0,-7,-3,-5][(musStep>>2)%4];tone(98*Math.pow(2,bs/12),spb*2.5,'sine',.06,0,d,MUS)}
    musStep++;musNext+=spb}}

/* ---------- kresliace pomôcky ---------- */
function P(){c.beginPath()}
function E(x,y,rx,ry){c.moveTo(x+Math.abs(rx),y);c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,TAU)}
function FS(f,lw){c.fillStyle=f;c.fill();if(lw!==0){c.lineWidth=lw||4;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function ST(lw,col){c.lineWidth=lw;c.strokeStyle=col||OL;c.lineJoin='round';c.lineCap='round';c.stroke()}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(R0,r){P();for(let k=0;k<10;k++){const a=-PI/2+k*PI/5,q=k%2?r:R0;k?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
function hl(x,y,rx,ry,a){P();E(x,y,rx,ry);c.fillStyle='rgba(255,255,255,'+(a||.4)+')';c.fill()}
function eyes(x1,x2,y,er,lx,ly,o){o=o||{};[x1,x2].forEach((x,i)=>{
  if(o.blink||o.closed){P();c.moveTo(x-er,y+(o.closed?er*.3:0));c.quadraticCurveTo(x,y+er*(o.closed?-.7:.4),x+er,y+(o.closed?er*.3:0));c.lineWidth=Math.max(3,er*.3);c.strokeStyle=OL;c.lineCap='round';c.stroke();return}
  if(o.squeeze){P();const s=i?-1:1;c.moveTo(x-s*er,y-er*.6);c.lineTo(x+s*er*.6,y);c.lineTo(x-s*er,y+er*.6);c.lineWidth=Math.max(3,er*.3);c.strokeStyle=OL;c.lineCap='round';c.lineJoin='round';c.stroke();return}
  P();E(x,y,er,er*1.18);FS('#fff',Math.max(2,er*.22));
  const pr=o.small?.34:.56;
  P();E(x+lx*er*.38,y+ly*er*.42,er*pr,er*pr*1.14);c.fillStyle='#20141c';c.fill();
  P();E(x+lx*er*.38-er*.15,y+ly*er*.42-er*.2,er*.17,er*.17);c.fillStyle='#fff';c.fill();
  if(o.angry){P();const s=i?-1:1;c.moveTo(x-s*er*1.1,y-er*1.7);c.lineTo(x+s*er*.9,y-er*1.0);c.lineWidth=er*.38;c.strokeStyle=OL;c.lineCap='round';c.stroke()}})}
function txt(s,x,y,size,col,al,lw){c.font='800 '+size+'px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';if(lw!==0){c.lineWidth=lw||size*.22;c.strokeStyle=OL;c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function puffs(B,col,lw){P();B.forEach(b=>E(b[0],b[1],b[2],b[3]));if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke()}c.fillStyle=col;c.fill()}
function bubble(x,y,r,fn){c.save();c.translate(x,y);P();E(0,0,r,r*.86);FS('#fff',4);P();E(-r*.55,r*.95,r*.16,r*.14);E(-r*.8,r*1.25,r*.09,r*.08);FS('#fff',3);fn(r);c.restore()}

/* ---------- miesta a poklady ---------- */
const PLC=[
  {k:'les',acc:'med',yours:'tvoj med',pron:'ho',nom:'med',food:'#f7b21c',food2:'#ffd86a',lid:'#e0563a',lid2:'#f5f0e0'},
  {k:'kuch',acc:'čokoládovú nátierku',yours:'tvoja čokoládová nátierka',pron:'ju',nom:'čokoládová nátierka',food:'#6e3b1f',food2:'#9a5a30',lid:'#f2c84b',lid2:'#ffffff'},
  {k:'zahr',acc:'jahodový džem',yours:'tvoj jahodový džem',pron:'ho',nom:'jahodový džem',food:'#e2344e',food2:'#ff6f86',lid:'#e2344e',lid2:'#ffffff'},
  {k:'zima',acc:'sušienky',yours:'tvoje sušienky',pron:'ich',nom:'sušienky',food:'cookie',food2:'#e0a45c',lid:'#4a7be0',lid2:'#ffffff'}];
function labelIcon(k,s){c.save();c.scale(s,s);
  if(k==='les'){P();E(-14,-12,12,9);E(14,-12,12,9);FS('rgba(220,240,255,.95)',3);P();E(0,0,20,15);FS('#ffcf2a',3.5);c.save();P();E(0,0,20,15);c.clip();c.fillStyle=OL;c.fillRect(-8,-16,6,32);c.fillRect(5,-16,6,32);c.restore();P();E(-22,-1,3,3);c.fillStyle=OL;c.fill()}
  else if(k==='kuch'){P();c.moveTo(0,-20);c.bezierCurveTo(18,-18,20,4,12,14);c.quadraticCurveTo(0,22,-12,14);c.bezierCurveTo(-20,4,-18,-18,0,-20);FS('#b9773d',3.5);P();c.moveTo(-14,-8);c.quadraticCurveTo(0,-16,14,-8);c.quadraticCurveTo(0,-26,-14,-8);FS('#7a4a26',3)}
  else if(k==='zahr'){P();c.moveTo(0,20);c.bezierCurveTo(-24,4,-18,-16,0,-12);c.bezierCurveTo(18,-16,24,4,0,20);FS('#e8364f',3.5);[[-7,-2],[6,-3],[0,8],[-3,-8],[8,6]].forEach(d=>{P();E(d[0],d[1],1.6,2.2);c.fillStyle='#ffe58a';c.fill()});P();c.moveTo(-12,-12);c.lineTo(0,-20);c.lineTo(12,-12);c.lineTo(0,-14);c.closePath();FS('#4caf50',2.5)}
  else{P();E(0,0,19,19);FS('#e0a45c',3.5);[[-7,-6],[6,-8],[8,5],[-5,7],[1,0]].forEach(d=>{P();E(d[0],d[1],3,3);c.fillStyle='#5a3218';c.fill()})}
  c.restore()}
function jar(x,y,s,p,lvl){const pl=PLC[p];c.save();c.translate(x,y);c.scale(s,s);
  P();E(0,0,58,10);c.fillStyle='rgba(0,0,0,.18)';c.fill();
  P();rr(-48,-104,96,104,24);c.fillStyle='rgba(225,242,255,.75)';c.fill();
  lvl=clamp(lvl,0,1);
  if(lvl>0){c.save();P();rr(-43,-99,86,94,20);c.clip();const h=92*lvl;
    if(pl.food==='cookie'){for(let k=0;k<12;k++){const row=Math.floor(k/3),col=k%3;const cy=-18-row*24;if(-cy-8>h)continue;P();E(-26+col*26+(row%2)*8,cy,16,9);FS('#e0a45c',2.5);P();E(-30+col*26+(row%2)*8,cy-2,2.5,2);E(-22+col*26+(row%2)*8,cy+1,2.5,2);c.fillStyle='#5a3218';c.fill()}}
    else{c.fillStyle=pl.food;c.fillRect(-46,-4-h,92,h+6);P();c.moveTo(-46,-4-h);for(let xx=-46;xx<=46;xx+=8)c.lineTo(xx,-4-h+Math.sin(xx*.2+T*2)*2.5);c.lineTo(46,-h+4);c.lineTo(-46,-h+4);c.fillStyle=pl.food2;c.fill()}
    c.restore()}
  P();rr(-48,-104,96,104,24);ST(4.5);
  hl(-30,-58,6,24,.6);
  P();rr(-50,-122,100,24,9);FS(pl.lid,4.5);
  c.save();P();rr(-50,-122,100,24,9);c.clip();c.fillStyle=pl.lid2;for(let k=-50;k<50;k+=20)c.fillRect(k,-122,10,24);c.restore();P();rr(-50,-122,100,24,9);ST(4.5);
  P();rr(-30,-74,60,44,12);FS('#fff6e0',3.5);c.translate(0,-52);labelIcon(pl.k,.95);
  c.restore()}
function spoon(x,y,s,p,rot){const pl=PLC[p];c.save();c.translate(x,y);c.rotate(rot||0);c.scale(s,s);P();c.moveTo(0,0);c.lineTo(0,34);ST(9);P();c.moveTo(0,0);c.lineTo(0,34);ST(4,'#d8dde6');P();E(0,-8,14,10);FS('#d8dde6',3.5);
  if(pl.food==='cookie'){P();E(0,-14,13,8);FS('#e0a45c',3);P();E(-4,-15,2,1.6);E(4,-13,2,1.6);c.fillStyle='#5a3218';c.fill()}else{P();E(0,-13,12,9);FS(pl.food,3);hl(-4,-16,3,2,.6)}c.restore()}

/* ---------- postavy ---------- */
const BR={fur:'#9a6235',tan:'#e2b57e',cap:'#e8443a',capD:'#b8302a',scarf:'#3fae5a',scarfD:'#2e8a45'};
function bearHead(o){o=o||{};
  P();E(-60,-14,20,20);E(60,-14,20,20);FS(BR.fur,4.5);P();E(-60,-14,10,10);E(60,-14,10,10);c.fillStyle=BR.tan;c.fill();
  P();E(0,0,68,60);FS(BR.fur,4.5);hl(-30,-18,16,10,.18);
  P();E(0,22,36,26);FS(BR.tan,3.5);
  P();E(-42,18,12,8);E(42,18,12,8);c.fillStyle='rgba(255,110,120,.35)';c.fill();
  const ey=-8;
  if(o.eyes==='closed')eyes(-26,26,ey,11,0,0,{closed:1});
  else if(o.eyes==='half'){eyes(-26,26,ey,11,0,0,{closed:1});P();c.moveTo(-36,ey-16);c.lineTo(-16,ey-12);c.moveTo(36,ey-16);c.lineTo(16,ey-12);ST(4)}
  else eyes(-26,26,ey,12,o.lx||0,o.ly||0,{angry:o.angry,blink:!o.angry&&(T*.9+(o.ph||0))%3.6<.12,small:o.surp});
  P();E(0,8,14,10);FS('#2a1a12',0);hl(-4,4,4,2.5,.6);
  if(o.mouth==='open'){P();E(0,36,17,14);FS('#7a1f2a',3.5);P();E(0,43,9,5);c.fillStyle='#ff7d8e';c.fill()}
  else if(o.mouth==='snore'){P();E(0,34,6,5);FS('#7a1f2a',3)}
  else if(o.mouth==='grin'){P();c.moveTo(-18,28);c.quadraticCurveTo(0,50,18,28);c.closePath();FS('#7a1f2a',3.5)}
  else{P();c.moveTo(0,18);c.lineTo(0,26);c.moveTo(-14,28);c.quadraticCurveTo(-6,34,0,26);c.quadraticCurveTo(6,34,14,28);ST(3.5)}
  // čiapka
  P();c.moveTo(-62,-20);c.bezierCurveTo(-64,-92,64,-92,62,-20);c.closePath();FS(BR.cap,4.5);
  c.save();P();c.moveTo(-62,-20);c.bezierCurveTo(-64,-92,64,-92,62,-20);c.closePath();c.clip();c.fillStyle=BR.capD;for(let k=-60;k<60;k+=24)c.fillRect(k,-100,10,90);c.restore();
  P();c.moveTo(-62,-20);c.bezierCurveTo(-64,-92,64,-92,62,-20);c.closePath();ST(4.5);
  P();rr(-68,-34,136,22,11);FS('#f5f0e0',4);
  P();E(0,-84,16,16);FS('#fff',4)}
function bear(x,y,s,o){o=o||{};c.save();c.translate(x,y);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  const t=T+(o.ph||0),sit=o.sit,wk=o.walk?Math.sin(t*13):0,bob=o.walk?-Math.abs(Math.sin(t*13))*8:(o.dance?-Math.abs(Math.sin(t*6))*16:(sit?Math.sin(t*1.4)*3:Math.sin(t*2)*2));
  P();E(0,0,sit?110:80,14);c.fillStyle='rgba(0,0,0,.16)';c.fill();
  if(sit){P();E(-56,-22,44,26);E(56,-22,44,26);FS(BR.fur,4.5);P();E(-92,-22,13,18);E(92,-22,13,18);FS(BR.tan,3)}
  else{P();E(-38,-24+wk*7,28,26);FS(BR.fur,4.5);P();E(38,-24-wk*7,28,26);FS(BR.fur,4.5)}
  c.translate(0,(sit?34:0)+bob);
  if(o.lean)c.rotate(o.lean);
  P();E(0,-112,84,92);FS(BR.fur,4.5);P();E(0,-100,54,62);c.fillStyle=BR.tan;c.fill();
  const arm=(sx,ang)=>{c.save();c.translate(sx*64,-154);c.rotate(-sx*ang);P();E(0,40,24,46);FS(BR.fur,4.5);P();E(0,76,15,11);c.fillStyle=BR.tan;c.fill();c.restore()};
  let a=.35,b=.35;
  if(o.arms==='up'){a=2.5+Math.sin(t*16)*.15;b=2.5-Math.sin(t*16)*.15}
  else if(o.arms==='hug'){a=b=-.55}
  else if(o.arms==='wave'){a=.35;b=2.4+Math.sin(t*8)*.35}
  else if(o.arms==='scratch'){a=.35;b=2.9}

  if(g.ph==='intro'){g.pt+=dt;snoreFx(dt);return}

  g.t+=dt;
  // medveď
  if(g.sub!=='chased'){g.bt-=dt;
    if(g.bs==='sleep'){snoreFx(dt);if(g.bt<=0){g.bs='stir';g.bt=stirDur();SFX.hmm();g.adStop=0;if(!e&&g.warned<3&&!speaking()){say('Pozor!');g.warned++}else if(e&&g.hold){say('Pst! Stoj!')}}}
    else if(g.bs==='stir'){if(g.bt<=0){if(!e&&g.L.lv>=3&&Math.random()<.3){g.bs='sleep';g.bt=rnd(1.2,2.5)}else{g.bs='look';g.bt=e?rnd(1.4,2):rnd(1.5,2.6);g.grace=.22;g.lookMoved=0}}}

function snoreFx(dt){const g=G;g.snT-=dt;g.zT-=dt;if(g.snT<=0){SFX.snore();g.snT=2.2}if(g.zT<=0){g.zT=.8;FX.push({x:g.BX+30,y:g.PY-250,vx:rnd(20,40),vy:-50,life:1.8,max:1.8,r:rnd(26,40),zz:1})}}
function caught(){const g=G;g.hearts--;g.sub='chased';g.st=0;g.dirn=-1;g.carry=0;g.bs='angry';g.shake=.4;SFX.roar();setTimeout(()=>{SFX.squeak();setTimeout(SFX.squeak,150)},300);
  bearSay(pick(['Hej! Kto mi to kradne?','Hej! Čo tu robíte?','Aha! Mám vás!']))}
function deliver(){const g=G;g.loads++;g.carry=0;g.sub='deliv';g.st=0;SFX.load();stars(g.HX,g.PY-120,g.easy?5:3);
  if(g.loads<g.need)say(g.loads===1?(g.easy?'Jeden! Super! Ideme znova!':'Jeden je doma! Ešte raz!'):'Ďalší je doma! Ešte jeden!');else say('Hurá! Máme všetko!')}
function sneakDown(p){const g=G;if(g.ph==='intro'){hush();g.ph='play'}g.hold=true;g.holdId=p.id;g.helpT=0}
function sneakUp(p){const g=G;if(p.id===g.holdId)g.hold=false}
function drawSneak(){const g=G,e=g.easy;c.save();if(g.shake>0)c.translate(rnd(-7,7),rnd(-7,7));bg(g.p);
  hideout(g.HX-20,g.PY-6,1);
  // nazbierané lyžičky pri úkryte
  for(let k=0;k<g.need;k++){const x=g.HX-80+k*40,y=g.PY+50;if(k<g.loads)spoon(x,y,1,g.p,-.4+k*.3);else{c.globalAlpha=.3;spoon(x,y,1,g.p,-.4+k*.3);c.globalAlpha=1}}
  for(const tw of g.twigs)twig(tw.x,g.PY+18,1,tw.br>0);
  // medveď a poklad
  const bs=g.bs,ang=bs==='angry';
  if(ang){const bx=g.BX-Math.min(1,g.st*2)*90;bear(bx,g.PY+6,.62,{arms:'up',mouth:'open',angry:1,lx:-1,walk:g.st<.5})}
  else bear(g.BX,g.PY-6,.58,{sit:1,eyes:bs==='sleep'?'closed':bs==='stir'?'half':null,mouth:bs==='sleep'?'snore':null,tilt:bs==='sleep'?.18+Math.sin(T*1.4)*.04:bs==='stir'?Math.sin(T*9)*.08:-.1,lx:-1,ly:.2});
  if(bs==='stir')bubble(g.BX+70,g.PY-300,34,()=>txt('?',0,2,50,'#ffb340'));
  if(bs==='look')bubble(g.BX+70,g.PY-300,34,()=>txt('!',0,2,52,'#e8443a'));
  stump(g.JX,g.PY+4,.9);const lvl=1-(g.loads+(g.carry?1:0)+g.fill)/(g.need+1);jar(g.JX,g.PY-36,.95,g.p,lvl);
  // skupinka
  const chased=g.sub==='chased',frozen=!g.moving&&!chased&&(bs==='stir'||bs==='look'),dd=chased?-1:g.dirn;
  for(let k=g.n-1;k>=0;k--){const x=g.gx-k*52*dd,y=g.PY+(k%2)*10;
    pistun(x,y,.95,{col:PC[k],ph:k*.7,dir:dd,walk:g.moving||chased,fast:chased,scared:chased,freeze:frozen&&k%2===1,lx:frozen&&k%2===0?-.2:.6,mouth:frozen?'o':null,carry:(g.carry||(g.sub==='fill'&&g.st>.6))?g.p:null})}
  updFX(1/60);drawFX();c.restore();
  // HUD – semafor s okom
  const cx=VW/2,cy=58,col=bs==='sleep'?'#5fd16a':bs==='stir'?'#ffc93a':'#ff5470';
  P();E(cx,cy,44,44);FS(col,5);c.save();c.translate(cx,cy);
  if(bs==='sleep'){P();c.moveTo(-24,-2);c.quadraticCurveTo(0,16,24,-2);ST(6);txt('z',26,-22,26,'#fff',null,5)}
  else if(bs==='stir'){P();c.moveTo(-24,0);c.quadraticCurveTo(0,-14,24,0);c.quadraticCurveTo(0,12,-24,0);FS('#fff',5);P();E(0,0,7,5);c.fillStyle=OL;c.fill()}
  else{P();c.moveTo(-26,0);c.quadraticCurveTo(0,-26,26,0);c.quadraticCurveTo(0,26,-26,0);FS('#fff',5);P();E(0,0,11,11);c.fillStyle=OL;c.fill()}
  c.restore();
  if(!e)for(let k=0;k<3;k++)icon(k<g.hearts?'heart':'heartOff',cx-170+k*44,58,.5);
  homeBtn(goMap);sndBtn();
  if((g.sub==='go'||g.sub==='back')&&!g.hold&&bs==='sleep'&&g.ph!=='end'){const a=.6+Math.sin(T*5)*.3;c.globalAlpha=a;icon('hand',VW/2,VH-80+Math.sin(T*5)*6,1.1);c.globalAlpha=1}}

/* ================= OBRAZOVKY ================= */
function go(s){scr=s;fade=1;FX.length=0;press=null}
function menuBg(){bg(0)}
function drawSplash(){menuBg();
  txt('Brumko',VW/2+170,VH*.22,100,'#ffcf3a');txt('a Pišťúni',VW/2+170,VH*.38,80,'#fff');
  bear(VW*.26,VH*.9,.95,{arms:'wave',mouth:'grin'});
  jar(VW*.5,VH*.92,.9,0,.9);
  pistun(VW*.62,VH*.93,1.2,{col:PC[0],dir:-1,ph:0,mouth:'grin',lx:-.6});pistun(VW*.92,VH*.95,1.1,{col:PC[2],dir:-1,ph:1.3,dance:1,mouth:'grin'});
  button(VW/2+170,VH*.6,80,'next',()=>{prime();go('select');say('Kto ide hrať? Maťko, alebo Adamko?')},{pulse:1,is:.016,col:'#fff'})}
function drawSelect(){menuBg();const y=VH*.48,d=Math.min(VW*.26,330);
  for(const p of ['matko','adamko']){const x=VW/2+(p==='matko'?-d:d),r=p==='matko'?150:125;
    button(x,y,r,rr2=>{c.save();c.translate(0,rr2*.08);kidFace(p,rr2*.62);c.restore()},{id:'pl'+p,col:p==='matko'?'#cfe7ff':'#fff1c4'});
    btns[btns.length-1].fn=()=>{PL=p;goMap(true)};
    const n=doneCount(p);for(let k=0;k<LV.length;k++)icon(k<n?'star':'starOff',x-(LV.length-1)*17+k*34,y+r+46,.33)}
  sndBtn()}
/* --- mapa --- */
let MAPP=[];
function mapPos(){MAPP=[];const n=LV.length,x0=110,x1=VW-110;for(let i=0;i<n;i++)MAPP.push({x:lerp(x0,x1,i/(n-1)),y:i%2?470:300})}
function goMap(first){go('map');G=null;MT=0;const sv=SAVE[PL],n=doneCount(PL);
  if(first===true){if(!sv.intro){sv.intro=1;store();say('Ahoj '+NM[PL].N+'! Toto je medveď Brumko a toto sú Pišťúni. Raz budeš Brumko a budeš strážiť dobroty. A raz budeš Pišťún a budeš ich potichu kradnúť. Ťukni na blikajúci kruh!')}
    else say('Ahoj '+NM[PL].N+'! Ťukni na blikajúci kruh.')}
  else if(n>=LV.length)say('Všetko je hotové! Môžeš hrať hocičo znova.')}
function drawMap(dt){MT+=dt;menuBg();mapPos();const sv=SAVE[PL],n=doneCount(PL);
  P();MAPP.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.lineWidth=26;c.strokeStyle='rgba(255,250,235,.85)';c.lineCap='round';c.lineJoin='round';c.setLineDash([2,34]);c.stroke();c.setLineDash([]);
  for(let p=0;p<4;p++){const a=MAPP[p*2],b=MAPP[p*2+1];const x=(a.x+b.x)/2,y=330+75;jar(x,y+30,.48,p,.85)}
  for(let i=0;i<LV.length;i++){const q=MAPP[i],L=LV[i],un=i<=n,cur=i===Math.min(n,LV.length-1)&&i===n,r=56;
    button(q.x,q.y,r,rr2=>{if(!un){c.globalAlpha=.55}c.save();P();E(0,0,rr2-6,rr2-6);c.clip();c.fillStyle=L.mode==='guard'?'#ffe0b0':'#d8f3ff';c.fillRect(-rr2,-rr2,rr2*2,rr2*2);
        if(L.mode==='guard'){c.translate(0,14);c.scale(.62,.62);bearHead({mouth:'grin'})}else{pistun(0,40,1.25,{col:PC[(L.p*2)%PC.length],ph:i,mouth:'grin'})}
        c.restore();c.globalAlpha=1;if(!un)icon('lock',rr2*.55,rr2*.5,.5)},
      {id:'lv'+i,pulse:cur,col:cur?'#fff':'#fffaf2'});
    btns[btns.length-1].fn=un?()=>startLevel(i):()=>{SFX.wrong();say('Toto je ešte zamknuté.')};
    const st=sv.st[i]||0;if(un&&i<n)for(let k=0;k<3;k++)icon(k<st?'star':'starOff',q.x-30+k*30,q.y+r+22,.32)}
  homeBtn(()=>{go('select')});sndBtn()}
/* --- výsledok --- */
const STW=['','jednu hviezdičku','dve hviezdičky','tri hviezdičky'];
function goResult(win){const g=G,sv=SAVE[PL];let st=0;
  if(win){if(g.easy)st=3;else if(g.mode==='guard'){const r=g.honey/g.max;st=r>=.8?3:r>=.5?2:1}else st=g.hearts>=3?3:g.hearts>=2?2:1;
    sv.st[g.i]=Math.max(sv.st[g.i]||0,st);store()}
  R={i:g.i,win,st,t:0,mode:g.mode,p:g.p,shown:0};go('result');hush();
  const pl=PLC[g.p];let s;
  if(win){if(g.mode==='guard')s='Hurá! Brumko ubránil '+pl.acc+'! Dostávaš '+STW[st]+'.';
    else s='Hurá! Pišťúni majú '+pl.acc+'! Dostávaš '+STW[st]+'. A potom sa Brumko s Pišťúnmi o všetko podelili. Spolu je to najlepšie!'}
  else s=g.mode==='guard'?'Ojoj, Pišťúni boli rýchlejší. Nevadí, skúsime to znova!':'Brumko vás prichytil. Nevadí, skúsime to znova!';
  say(s)}
function drawResult(dt){R.t+=dt;bg(R.p);const cx=VW/2,gy=VH*.86;
  if(R.win&&R.mode==='sneak'){jar(cx+40,gy-10,1,R.p,.4);bear(cx+210,gy,.62,{sit:1,mouth:'grin',arms:'hug'});
    for(let k=0;k<4;k++)pistun(cx-380+k*88,gy+(k%2)*12,1.05,{col:PC[k],ph:k,dance:1,mouth:'grin',carry:R.p,dir:1});
    if(Math.random()<dt*2)hearts(cx,gy-260,1)}
  else if(R.win){stump(cx,gy,1);jar(cx,gy-42,1,R.p,.9);bear(cx+190,gy+10,.62,{dance:1,mouth:'grin'});
    for(let k=0;k<3;k++)pistun(cx-210-k*90,gy+(k%2)*12,1,{col:PC[k],ph:k,dir:1,mouth:'o',lx:.8})}
  else if(R.mode==='guard'){stump(cx,gy,1);jar(cx,gy-42,1,R.p,0);bear(cx+190,gy+10,.62,{arms:'scratch',mouth:'open',surp:1});
    for(let k=0;k<3;k++)pistun(cx-200-k*90,gy+(k%2)*12,1,{col:PC[k],ph:k,dir:1,dance:1,mouth:'grin',carry:R.p})}
  else{jar(cx+60,gy-10,1,R.p,1);bear(cx+230,gy,.62,{arms:'hug',mouth:'grin'});for(let k=0;k<3;k++)pistun(cx-260+k*80,gy+(k%2)*12,1,{col:PC[k],ph:k,dir:-1,mouth:'o'})}
  // hviezdy
  if(R.win){for(let k=0;k<3;k++){const ap=R.t-.5-k*.45;if(ap<0){icon('starOff',cx-110+k*110,130,1.05);continue}
      if(k<R.st&&R.shown<=k){R.shown=k+1;SFX.star();stars(cx-110+k*110,130,6)}
      const sc=k<R.st?1.05+Math.max(0,.4-ap)*1.2:1.05;icon(k<R.st?'star':'starOff',cx-110+k*110,130,sc,k<R.st?Math.sin(T*2+k)*.08:0)}}
  updFX(dt);drawFX();
  const by=VH*.42;const nxt=R.win&&R.i+1<LV.length;
  button(cx-(nxt?150:90),by,54,'home',()=>{hush();goMap()},{is:.014});
  button(cx+(nxt?0:90),by,54,'replay',()=>startLevel(R.i),{is:.014,pulse:!R.win});
  if(nxt)button(cx+150,by,60,'next',()=>startLevel(R.i+1),{is:.016,pulse:1});
  sndBtn()}
/* ================= SLUČKA ================= */
let last=0,slow=0;
function drawIcon(){bg(0);stump(VW*.5,VH*.92,1.6);jar(VW*.5,VH*.92-68,1.6,0,.85);bear(VW*.27,VH*1.02,.95,{arms:'wave',mouth:'grin'});pistun(VW*.76,VH*.95,2.1,{col:PC[0],dir:-1,mouth:'grin',lx:-.6})}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;btns=[];c.setTransform(S,0,0,S,0,0);
  if(dt>.034&&scr==='play'){slow+=dt;if(slow>2.5&&qual>1){qual=Math.max(1,qual-.5);resize();slow=0}}else slow=Math.max(0,slow-dt*.5);
  try{
    if(location.hash==='#icon')drawIcon();
    else if(scr==='splash')drawSplash();
    else if(scr==='select')drawSelect();
    else if(scr==='map')drawMap(dt);
    else if(scr==='play'){if(G.mode==='guard'){updGuard(dt);if(scr==='play')drawGuard()}else{updSneak(dt);if(scr==='play')drawSneak()}}
    else if(scr==='result')drawResult(dt);
    if(scr!=='play'&&scr!=='result'){updFX(dt);drawFX()}
  }catch(e){console.error(e)}
  if(fade>0){fade=Math.max(0,fade-dt*3);c.fillStyle='rgba(255,255,255,'+fade+')';c.fillRect(0,0,VW,VH)}
  musicTick()}
function toV(e){return {x:e.clientX*DPR/S,y:e.clientY*DPR/S,id:e.pointerId}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(hyp(b.x-p.x,b.y-p.y)<b.r)return b}return null}
function playDown(p){if(!G)return;if(G.mode==='guard')guardDown(p);else sneakDown(p)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toV(e);const b=hitBtn(p);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(b){press={id:b.id,fn:b.fn,x:b.x,y:b.y,r:b.r,pid:e.pointerId};return}
  if(scr==='play')playDown(p)});
cv.addEventListener('pointermove',e=>{if(scr==='play'&&G&&G.mode==='guard')guardMove(toV(e))});
function upEv(e){const p=toV(e);prime();if(press&&press.pid===e.pointerId){const pr=press;press=null;if(hyp(pr.x-p.x,pr.y-p.y)<pr.r+30){SFX.tap();pr.fn()}return}
  if(scr==='play'&&G){if(G.mode==='sneak')sneakUp(p);else if(G.drag===p.id)G.drag=null}}
cv.addEventListener('pointerup',upEv);
cv.addEventListener('pointercancel',e=>{press=null;if(G){if(G.mode==='sneak')sneakUp(toV(e));G.drag=null}});
addEventListener('touchend',()=>{ac();prime()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(G)G.hold=false;if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
const FSC={on:()=>document.fullscreenElement||document.webkitFullscreenElement,can:()=>document.fullscreenEnabled||document.webkitFullscreenEnabled,land:()=>innerWidth>innerHeight};
function fsGo(){if(!FSC.can()||FSC.on()||!FSC.land())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
['pointerup','touchend'].forEach(ev=>addEventListener(ev,fsGo,true));
resize();requestAnimationFrame(frame);
window.__T={get G(){return G},get R(){return R},go,goMap,startLevel,goResult,setPL:p=>{PL=p},scr:()=>scr,SAVE:()=>SAVE,upd:dt=>{if(G.mode==='guard')updGuard(dt);else updSneak(dt)}};
</script>
