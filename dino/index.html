<html lang="sk">

<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div></div>
<script>
'use strict';
/* ===== Dino vykopávky – hra pre Maťka a Adamka ===== */
const cv=document.getElementById('c');let c=cv.getContext('2d');
const VH=720,PI=Math.PI,TAU=PI*2,OL='#4a3220',BONE='#f6ead0',BONEL='#7b5a36',BONED='#e2d2ae';
let VW=1280,S=1,DPR=1,T=0,scr='splash',fade=1,btns=[],press=null,PL=null,LC=OL;
let DG=null,BD=null,RN=null,CD=null,MU=null,MAPT=0;
const FX=[];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],hyp=Math.hypot,lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';S=cv.height/VH;VW=cv.width/S;GR={}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- ukladanie ---------- */
const KEY='dinoVykopavky.v1';
const blankP=()=>({done:{},tr:{},trSeen:{},tut:0,fin:0});
const blank=()=>({mus:1,matko:blankP(),adamko:blankP()});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.matko&&s.adamko)return s}catch(e){}return blank()}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}
const NM={matko:{N:'Maťko',V:'Maťko'},adamko:{N:'Adamko',V:'Adamko'}};
const isA=()=>PL==='adamko';

/* ---------- hlas ---------- */
let skV=null,sayTok=0,lastSayAt=-9;
function pickV(){try{const vs=speechSynthesis.getVoices();skV=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,cb){const tok=++sayTok;let done=false;lastSayAt=T;const fin=()=>{if(done||tok!==sayTok)return;done=true;if(cb)cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skV)u.voice=skV;u.rate=1;u.pitch=1.08;u.onend=()=>setTimeout(fin,250);speechSynthesis.speak(u)}catch(e){}
  if(cb)setTimeout(fin,1800+t.length*95)}
function speaking(){try{return speechSynthesis.speaking}catch(e){return false}}
function sayQ(t){if(!speaking()&&T-lastSayAt>1.2)say(t)}
function hush(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let primed=false;function prime(){if(primed)return;primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}

/* ---------- zvuky a hudba ---------- */
let AC=null,OUT=null,MUS=null,NZ=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=1;MUS.connect(OUT)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function live(){return AC&&AC.state==='running'}
function tone(f,d,type,vol,f2,delay,dest){if(!live())return;const a=AC,t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.03)}
function nbuf(){if(!NZ){const n=AC.sampleRate;NZ=AC.createBuffer(1,n,AC.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return NZ}
function noise(d,vol,ft,f,f2,delay,q){if(!live())return;const a=AC,t=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=nbuf();const fl=a.createBiquadFilter();fl.type=ft||'lowpass';fl.frequency.setValueAtTime(f||800,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);if(q)fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(OUT);s.start(t,Math.random()*.6);s.stop(t+d+.05)}
function roar(base,kind){if(!live())return;const a=AC,t=a.currentTime;const o=a.createOscillator(),o2=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
  o.type='sawtooth';o2.type='square';const b=base;
  if(kind==='kraa'){o.frequency.setValueAtTime(b*2.2,t);o.frequency.linearRampToValueAtTime(b*2.8,t+.12);o.frequency.exponentialRampToValueAtTime(b*1.5,t+.55)}
  else{o.frequency.setValueAtTime(b*1.2,t);o.frequency.linearRampToValueAtTime(b*1.7,t+.18);o.frequency.exponentialRampToValueAtTime(b*.75,t+.85)}
  o2.frequency.setValueAtTime(b*.6,t);o2.frequency.exponentialRampToValueAtTime(b*.4,t+.85);
  lfo.frequency.value=kind==='kraa'?30:20;lg.gain.value=b*.1;lfo.connect(lg);lg.connect(o.frequency);
  fl.type='lowpass';fl.Q.value=7;fl.frequency.setValueAtTime(500,t);fl.frequency.linearRampToValueAtTime(kind==='kraa'?3200:2000,t+.2);fl.frequency.exponentialRampToValueAtTime(450,t+.9);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.06);g.gain.setValueAtTime(.22,t+.45);g.gain.exponentialRampToValueAtTime(.0001,t+.92);
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(OUT);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+.95)})}
const SFX={
  tap(){tone(700,.08,'sine',.18,900)},
  shovel(){noise(.13,.22,'lowpass',900,260);tone(120,.08,'sine',.12,70)},
  brush(){noise(.16,.1,'bandpass',3200,2400,0,1.2)},
  cink(){tone(1900,.18,'triangle',.12,1700);tone(2850,.12,'sine',.06)},
  bone(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.16,0,i*.08))},
  treasure(){[1047,1319,1568,2093,2637].forEach((f,i)=>tone(f,.22,'sine',.12,0,i*.06))},
  lift(){tone(400,.35,'sine',.12,1200)},
  snap(){noise(.06,.3,'bandpass',1400,900,0,3);tone(880,.15,'triangle',.14,0,.04);tone(1320,.2,'sine',.1,0,.1)},
  boing(){tone(300,.3,'sine',.2,160);tone(420,.2,'triangle',.06,220,.05)},
  magic(){for(let i=0;i<12;i++)tone(800+i*120+Math.random()*200,.18,'sine',.07,0,i*.06)},
  jump(){tone(330,.22,'sine',.2,760)},
  step(){tone(90,.08,'sine',.16,55)},
  yum(){noise(.07,.18,'bandpass',900,0,0,2);noise(.07,.16,'bandpass',800,0,.1,2);[660,880,1180].forEach((f,i)=>tone(f,.13,'sine',.15,0,.16+i*.07))},
  yuck(){tone(240,.4,'square',.06,110);tone(180,.4,'sawtooth',.04,90,.05)},
  bump(){noise(.18,.3,'lowpass',400,120);tone(160,.25,'sine',.2,60);[1200,1500,1300].forEach((f,i)=>tone(f,.1,'sine',.05,0,.15+i*.08))},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.18,0,i*.12))},
  wrong(){tone(330,.16,'sine',.18);tone(250,.3,'sine',.18,0,.16)},
  right(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.09))},
  star(){tone(1320,.3,'sine',.16,1980)},
  whoosh(){noise(.35,.12,'bandpass',600,2400,0,1.5)}
};
const MEL={menu:[0,4,7,9,7,4,2,4,0,-1,7,9,12,9,7,-1],run:[0,4,7,4,0,4,7,12,9,7,5,4,2,4,7,-1],dig:[0,-1,4,-1,7,-1,4,-1,5,-1,9,-1,7,-1,4,-1]};
let musStep=0,musNext=0;
function musicTick(){if(!live()||!SAVE.mus)return;const m=scr==='run'?MEL.run:scr==='dig'?MEL.dig:MEL.menu,spb=scr==='run'?.17:.25;MUS.gain.value=speaking()?.3:1;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){const n=m[musStep%16],d=musNext-AC.currentTime;if(n>=0)tone(392*Math.pow(2,n/12),spb*.8,'triangle',.03,0,d,MUS);if(musStep%4===0)tone(98*Math.pow(2,[0,5,7,5][(musStep>>4)%4]/12),spb*3,'sine',.06,0,d,MUS);if(scr==='run'&&musStep%2===1)noise(.04,.03,'highpass',6000,0,d);musStep++;musNext+=spb}}

/* ---------- kresliace pomôcky ---------- */
let GR={};
function P(){c.beginPath()}
function E(x,y,rx,ry){c.moveTo(x+rx,y);c.ellipse(x,y,rx,ry,0,0,TAU)}
function FS(f,lw){c.fillStyle=f;c.fill();if(lw!==0){c.lineWidth=lw||4;c.strokeStyle=LC;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(R,r){P();for(let k=0;k<10;k++){const a=-PI/2+k*PI/5,q=k%2?r:R;k?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
function hl(x,y,rx,ry,a){P();E(x,y,rx,ry);c.fillStyle='rgba(255,255,255,'+(a||.4)+')';c.fill()}
function txt(s,x,y,size,col,al,lw){c.font='800 '+size+'px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';if(lw!==0){c.lineWidth=lw||size*.22;c.strokeStyle=OL;c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function ellPt(cx,cy,rx,ry,r,th){const co=Math.cos(r),si=Math.sin(r),x=rx*Math.cos(th),y=ry*Math.sin(th);return [cx+x*co-y*si,cy+x*si+y*co]}
function rotPts(pts,cx,cy,a){if(!a)return pts;const co=Math.cos(a),si=Math.sin(a);return pts.map(p=>[cx+(p[0]-cx)*co-(p[1]-cy)*si,cy+(p[0]-cx)*si+(p[1]-cy)*co,p[2]])}
function withCtx(ctx,fn){const o=c,ol=LC;c=ctx;try{fn()}finally{c=o;LC=ol}}
function smoothTo(A){for(let i=1;i<A.length-1;i++)c.quadraticCurveTo(A[i][0],A[i][1],(A[i][0]+A[i+1][0])/2,(A[i][1]+A[i+1][1])/2);c.lineTo(A[A.length-1][0],A[A.length-1][1])}
function tubeP(p){const n=p.length,L=[],R=[],N=[];
  for(let i=0;i<n;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(n-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],d=hyp(dx,dy)||1,nx=-dy/d,ny=dx/d;N.push(Math.atan2(ny,nx));L.push([p[i][0]+nx*p[i][2],p[i][1]+ny*p[i][2]]);R.push([p[i][0]-nx*p[i][2],p[i][1]-ny*p[i][2]])}
  c.moveTo(L[0][0],L[0][1]);smoothTo(L);const e=p[n-1];c.arc(e[0],e[1],e[2],N[n-1],N[n-1]-PI,true);
  const Rr=R.slice().reverse();c.lineTo(Rr[0][0],Rr[0][1]);smoothTo(Rr);const s=p[0];c.arc(s[0],s[1],s[2],N[0]+PI,N[0],true);c.closePath()}
function hornP(bx,by,tx,ty,w,bend){const dx=tx-bx,dy=ty-by,d=hyp(dx,dy),nx=-dy/d,ny=dx/d,b=bend||0;const mx=(bx+tx)/2+nx*b,my=(by+ty)/2+ny*b;P();c.moveTo(bx+nx*w,by+ny*w);c.quadraticCurveTo(mx+nx*w*.55,my+ny*w*.55,tx,ty);c.quadraticCurveTo(mx-nx*w*.55,my-ny*w*.55,bx-nx*w,by-ny*w);c.closePath()}
function eye(x,y,r,a,m){if(m==='b'){P();E(x,y,r*1.25,r*1.15);c.fillStyle='#5a3e26';c.fill();return}
  if(a&&a.blink){P();c.moveTo(x-r,y);c.quadraticCurveTo(x,y+r*.6,x+r,y);c.lineWidth=Math.max(3,r*.3);c.strokeStyle=OL;c.lineCap='round';c.stroke();return}
  P();E(x,y,r,r*1.12);FS('#fff',3);P();E(x+r*.3,y+r*.08,r*.56,r*.64);c.fillStyle='#25170e';c.fill();P();E(x+r*.12,y-r*.22,r*.2,r*.2);c.fillStyle='#fff';c.fill()}
function smile(x0,y0,x1,y1,bend,a,m){if(m==='b')return;if(a&&a.jaw>.2){P();const mx=(x0+x1)/2,my=(y0+y1)/2;c.moveTo(x0,y0);c.quadraticCurveTo(mx,my+bend*3*a.jaw+6,x1,y1);c.quadraticCurveTo(mx,my-4,x0,y0);c.closePath();FS('#7a2333',3);return}
  P();c.moveTo(x0,y0);c.quadraticCurveTo((x0+x1)/2,(y0+y1)/2+bend,x1,y1);c.lineWidth=3.5;c.strokeStyle=OL;c.lineCap='round';c.stroke()}
function blush(x,y,r,m){if(m==='b')return;P();E(x,y,r,r*.6);c.fillStyle='rgba(255,110,110,.35)';c.fill()}

/* ================= DINOSAURY ================= */
/* každý druh: zoznam položiek (časti) v miestnych súradniciach, zem y=0, hlava vpravo */
const SP={};
function plate(x,y,h,ang,K,m,far){c.save();c.translate(x,y);c.rotate(ang);P();c.moveTo(-h*.42,10);c.quadraticCurveTo(-h*.55,-h*.5,0,-h);c.quadraticCurveTo(h*.55,-h*.5,h*.42,10);c.closePath();FS(m==='b'?(far?BONED:BONE):(far?K.d:K.a),4);
  if(m==='f'&&!far){P();c.moveTo(0,0);c.lineTo(0,-h*.7);c.lineWidth=3;c.strokeStyle='rgba(120,50,20,.35)';c.stroke()}c.restore()}
SP.tri={col:{b:'#f2a65a',d:'#c7772f',l:'#fbe0b0',a:'#4fb3a9'},mouth:[280,-140],base:120,
  items(a){const s=a.leg||0,sw=a.sw||0,bob=a.bob||0;return [
    {p:'legB',k:'limb',far:1,pts:rotPts([[-50,-170,44],[-58,-95,34],[-52,-28,28]],-50,-170,-s)},
    {p:'legF',k:'limb',far:1,pts:rotPts([[128,-158,36],[132,-90,29],[130,-26,26]],128,-158,s)},
    {k:'main',sh:[{p:'tail',t:'tube',bk:'spine',pts:rotPts([[-140,-182,48],[-230,-165,32],[-310,-130,17],[-365,-102,6]],-140,-182,sw)},
      {p:'body',t:'ell',bk:'ribs',x:-5,y:-185+bob,rx:168,ry:96,r:0}]},
    {p:'head',k:'fn',f:triHead,ty:bob,piv:[150,-190,(a.hd||0)]},
    {p:'legB',k:'limb',pts:rotPts([[-85,-165,52],[-92,-90,40],[-85,-30,30]],-85,-165,s)},
    {p:'legF',k:'limb',pts:rotPts([[100,-155,42],[104,-88,33],[100,-28,28]],100,-155,-s)}]}};
function triHead(m,K,a){
  hornP(186,-206,248,-274,12,-10);FS(m==='b'?BONED:'#e6d6b0',4);
  const fx=146,fy=-224,frx=64,fry=86,fr=.55;
  for(let k=0;k<12;k++){const ph=PI*.62+k*(PI*1.22/11),th=ph-fr;const q=ellPt(fx,fy,frx,fry,fr,th);P();E(q[0],q[1],12,12);FS(m==='b'?BONE:K.a,4)}
  P();c.ellipse(fx,fy,frx,fry,fr,0,TAU);FS(m==='b'?BONE:K.a,5);
  if(m==='f'){c.fillStyle='#ffd166';[[120,-260,9],[150,-285,8],[105,-225,8],[130,-235,6],[165,-255,6]].forEach(q=>{P();E(q[0],q[1],q[2],q[2]);c.fill()})}
  else{P();E(125,-245,16,12);E(150,-270,11,9);c.fillStyle='#d8c39a';c.fill()}
  P();c.moveTo(135,-215);c.quadraticCurveTo(180,-234,212,-212);c.quadraticCurveTo(252,-195,288,-158);c.quadraticCurveTo(294,-138,272,-134);c.quadraticCurveTo(240,-118,205,-122);c.quadraticCurveTo(150,-118,132,-160);c.quadraticCurveTo(122,-195,135,-215);c.closePath();FS(m==='b'?BONE:K.b,5);
  if(m==='f'){P();c.moveTo(262,-170);c.quadraticCurveTo(282,-162,288,-158);c.quadraticCurveTo(294,-138,272,-134);c.quadraticCurveTo(262,-150,262,-170);c.closePath();FS(K.d,3)}
  hornP(196,-208,266,-284,14,-12);FS(m==='b'?BONE:'#fbf3dc',4);
  hornP(250,-186,262,-222,10,0);FS(m==='b'?BONE:'#fbf3dc',4);
  eye(210,-180,13,a,m);if(m==='b'){P();E(250,-160,7,9);c.fillStyle='#5a3e26';c.fill();P();E(170,-170,14,22);c.fillStyle='#d8c39a';c.fill()}
  smile(250,-140,212,-136,8,a,m);blush(186,-152,13,m)}
SP.steg={col:{b:'#8cc063',d:'#5e9640',l:'#dcefb4',a:'#f08a4b'},mouth:[275,-112],base:100,
  items(a){const s=a.leg||0,sw=a.sw||0,bob=a.bob||0,tp=[-135,-205];const it=[
    {p:'legB',k:'limb',far:1,pts:rotPts([[-55,-190,46],[-62,-105,36],[-55,-30,30]],-55,-190,-s)},
    {p:'legF',k:'limb',far:1,pts:rotPts([[125,-160,32],[128,-95,26],[126,-24,24]],125,-160,s)},
    {p:'tail',k:'fn',f:stegSpikes,piv:[tp[0],tp[1],sw]}];
    const bx=0,by=-195+bob,brx=155,bry=100,br=-.04;
    for(let row=0;row<2;row++)for(let k=0;k<7;k++){const th=PI*1.12+(k+row*.5)*(PI*.72/6.5);const q=ellPt(bx,by,brx*.96,bry*.96,br,th);const nx=Math.cos(th)/brx,ny=Math.sin(th)/bry;const ang=Math.atan2(ny,nx)+PI/2;const h=(48+46*Math.sin((th-PI)))*(row?1:.9);
      it.push({p:'body',k:'fn',f:(m,K)=>plate(q[0]+(row?0:-8),q[1],h,ang+br,K,m,!row)})}
    it.push({p:'neck',k:'fn',f:(m,K)=>{plate(168,-196,34,.75,K,m,1);plate(150,-212,42,.55,K,m,0)}});
    it.push({p:'tail',k:'fn',piv:[tp[0],tp[1],sw],f:(m,K)=>{plate(-180,-232,46,-.45,K,m,1);plate(-205,-226,38,-.5,K,m,0);plate(-250,-218,32,-.55,K,m,1);plate(-280,-208,26,-.6,K,m,0)}});
    it.push({k:'main',sh:[{p:'tail',t:'tube',bk:'spine',pts:rotPts([[-135,-205,50],[-240,-200,33],[-330,-178,18],[-395,-155,7]],tp[0],tp[1],sw)},
      {p:'neck',t:'tube',bk:'spine',pts:[[120,-200,44],[175,-165,30],[215,-140,22]]},
      {p:'body',t:'ell',bk:'ribs',x:bx,y:by,rx:brx,ry:bry,r:br}]});

  if(!R.done){R.spawn-=dt;if(R.spawn<=0){R.spawn=rnd(A?1.3:1.0,A?1.9:1.6);const good=DD[id].diet,bad=DIET[good].alt;
    if(fly){const wrong=!A&&Math.random()<.28;R.items.push({x:VW+60,y:rnd(150,540),k:wrong?bad:good,bad:wrong,ph:rnd(0,6)})}
    else{const r=Math.random(),mY=sp.mouth[1]*R.sc;
      if(r<.32){R.obs.push({x:VW+60,k:pick(['rock','log','bush'])});if(Math.random()<.6)R.items.push({x:VW+60,y:GY+mY-170,k:good,ph:0})}
      else if(r<.72||A){R.items.push({x:VW+60,y:GY+mY-(Math.random()<.5?0:150),k:good,ph:rnd(0,6)})}
      else R.items.push({x:VW+60,y:GY+mY-(Math.random()<.5?0:150),k:bad,bad:1,ph:rnd(0,6)})}}}
  /* skok / let */
  if(fly){if(R.hold)R.fy+=(R.ty-R.fy)*Math.min(1,dt*5);R.fy=clamp(R.fy,140,550)}
  else{if(R.jy>0||R.vy>0){R.jy+=R.vy*dt;R.vy-=2300*dt;if(R.jy<=0){R.jy=0;R.vy=0;SFX.step()}}
    if(A&&!R.done)for(const o of R.obs){if(!o.auto&&o.x-dx<170&&o.x-dx>40){o.auto=1;if(R.jy===0)jump()}}}
  /* prekážky */
  for(let i=R.obs.length-1;i>=0;i--){const o=R.obs[i];o.x-=spd*dt;if(o.x<-100){R.obs.splice(i,1);continue}drawObs(o);
    if(!o.hit&&Math.abs(o.x-dx-20)<55&&R.jy<55){o.hit=1;R.bumps++;R.dizzy=1;SFX.bump();sayQ(pick(['Bum! Nevadí, ide sa ďalej.','Jaj! Skoč skôr.','Hop! Treba vyskočiť.']))}}
  if(R.dizzy>0)R.dizzy-=dt;
  /* jedlo */
  const m=runMouth();
  for(let i=R.items.length-1;i>=0;i--){const it=R.items[i];it.x-=spd*dt*(fly?1:1);if(it.got){it.gt+=dt;if(it.gt>.4){R.items.splice(i,1)}continue}
    if(it.x<-80){R.items.splice(i,1);continue}
    if(A&&!it.bad){const d=hyp(it.x-m[0],it.y-m[1]);if(d<220){it.x+=(m[0]-it.x)*dt*3;it.y+=(m[1]-it.y)*dt*3}}
    const yy=it.y+Math.sin(T*3+it.ph)*8;c.save();c.translate(it.x,yy);P();E(0,0,52,52);c.fillStyle=it.bad?'rgba(255,255,255,.25)':'rgba(255,255,200,.45)';c.fill();icon(it.k,0,0,.82);c.restore();
    if(hyp(it.x-m[0],yy-m[1])<(A?95:70)){if(it.bad){if(!it.touched){it.touched=1;SFX.yuck();R.yuck=1;say(DD[id].name+' '+DIET[it.k].w+' neje! Fuj!')}}
      else{it.got=1;it.gt=0;R.got++;SFX.yum();spark(it.x,yy,10);FX.push({k:'tx',s:'+1',x:it.x,y:yy-40,t:0,l:.8,r:40,c:'#fff'});
        if(R.got>=R.need&&!R.done){R.done=1;R.doneT=0;SFX.win();confetti(60);say('Mňam! '+DD[id].name+' je najedený. Výborne!')}else if(R.got%3===0)sayQ(pick(['Mňam!','Ňam ňam!','Chutí mu!','Ešte!']))}}}
  /* dinosaurus */
  const a=idleAnim(T,id);if(!R.done&&!fly){a.leg=Math.sin(R.x*.035)*.42;a.bob=Math.abs(Math.sin(R.x*.035))*-6;if(R.jy===0&&T-R.lastStep>.3&&Math.abs(Math.sin(R.x*.035))<.15){R.lastStep=T;if(!A||Math.random()<.5)SFX.step()}}
  if(fly)a.flap=Math.sin(T*(R.hold?9:4))*.3;
  if(R.done){a.jaw=Math.max(0,Math.sin(R.doneT*6))*.6;R.doneT+=dt}
  let yy=fly?R.fy-sp.mouth[1]*R.sc:GY-R.jy;if(R.done&&!fly)yy-=Math.abs(Math.sin(R.doneT*5))*40;
  if(!fly){P();E(dx,GY+2,120*R.sc*2.4,14);c.fillStyle='rgba(0,0,0,.15)';c.fill()}
  drawDino(id,dx,yy,R.sc,{a});
  if(R.dizzy>0){for(let k=0;k<3;k++){c.save();c.translate(m[0]-40+Math.cos(T*8+k*2)*40,m[1]-90+Math.sin(T*8+k*2)*12);starPath(12,5);c.fillStyle='#ffd23f';c.fill();c.restore()}}
  /* počítadlo */
  const n=R.need,w=Math.min(56,(VW-360)/n);P();rr(VW/2-n*w/2-16,18,n*w+32,70,20);FS('rgba(255,250,235,.9)',4);
  for(let k=0;k<n;k++){c.save();c.translate(VW/2-(n-1)*w/2+k*w,53);if(k>=R.got)c.globalAlpha=.25;icon(DD[id].diet,0,0,.4);c.restore()}
  if(R.t<3&&!fly){drawHand(VW*.6,VH*.5,.9,(R.t%1)<.3)}
  if(R.t<3&&fly){drawHand(VW*.6,VH*.4+Math.sin(R.t*3)*100,.9)}
  updFX(dt);
  if(R.done&&R.doneT>3&&!R.left){R.left=1;finishSite()}
  homeBtn(()=>{hush();goMap()})}
function drawObs(o){c.save();c.translate(o.x,GY+6);LC=OL;if(o.k==='rock'){P();c.moveTo(-46,0);c.quadraticCurveTo(-44,-50,-6,-56);c.quadraticCurveTo(40,-52,46,0);c.closePath();FS('#a39a8c',4);hl(-14,-36,10,6,.5)}
  else if(o.k==='log'){P();rr(-56,-40,112,40,18);FS('#9a6a3c',4);P();E(46,-20,14,18);FS('#d9a066',3.5);P();E(46,-20,6,8);c.strokeStyle='#9a6a3c';c.lineWidth=2;c.stroke()}
  else{[[-30,-26,28],[10,-40,32],[34,-20,24]].forEach(q=>{P();E(q[0],q[1],q[2],q[2]);FS('#4f9d38',4)});c.fillStyle='#e8394d';[[-20,-34],[16,-52],[34,-28]].forEach(q=>{P();E(q[0],q[1],5,5);c.fill()})}c.restore()}
function jump(){const R=RN;if(R.jy===0&&!R.done){R.vy=930;R.jy=.01;SFX.jump()}}
function runDown(p){const R=RN;if(SP[R.id].fly){R.hold=true;R.ty=p.y}else jump()}
function runMove(p){const R=RN;if(R&&R.hold)R.ty=p.y}
function runUp(){if(RN)RN.hold=false}

/* ================= VÝSLEDOK ================= */
function finishSite(){const R=RN,id=R.id,A=isA();let st=1;if(R.trFound>=R.trN)st++;if(R.miss<=1&&R.bumps<=2)st++;if(A)st=3;
  const sv=SAVE[PL],first=!sv.done[id];sv.done[id]=Math.max(sv.done[id]||0,st);store();
  go('card');CD={id,st,t:0,first,i:R.i};SFX.win();
  const allDone=ORDER.every(k=>sv.done[k]);
  say(DD[id].name+'! '+DD[id].facts.join(' ')+(first&&allDone?' Máš všetky dinosaury v múzeu! Si skutočný paleontológ!':''))}
function sizeCompare(id,x,y,w,h){P();rr(x,y,w,h,18);FS('rgba(255,255,255,.75)',4);const b=bb(id),len=DD[id].len,kid=1.2;const gy=y+h-18;
  const dw=(w-70),sc=dw/(b.x1-b.x0);const dh=(b.y1-b.y0)*sc;const sc2=Math.min(1,(h-36)/dh);const px=dw*sc2/len;
  c.save();c.globalAlpha=.85;drawDino(id,x+20-b.x0*sc*sc2,gy-b.y1*sc*sc2+(SP[id].fly?0:0),sc*sc2,{a:{}});c.restore();
  const kh=kid*px;c.save();c.translate(x+w-30,gy);P();E(0,-kh*.82,kh*.14,kh*.14);c.fillStyle='#3a6ea5';c.fill();P();rr(-kh*.12,-kh*.68,kh*.24,kh*.4,kh*.08);c.fill();P();rr(-kh*.1,-kh*.3,kh*.08,kh*.3,kh*.03);rr(kh*.02,-kh*.3,kh*.08,kh*.3,kh*.03);c.fill();c.restore();
  P();c.moveTo(x+12,gy);c.lineTo(x+w-12,gy);c.lineWidth=3;c.strokeStyle=OL;c.stroke()}
function drawCard(dt){const C=CD,id=C.id;C.t+=dt;sceneBg(C.i,T*15);c.fillStyle=SITE[C.i].ground;c.fillRect(0,600,VW,VH-600);

  txt('Objavené!',VW/2,70,56,'#ffd23f');

  const bx=VW*.07,bw=VW*.5;fitDino(id,bx+bw/2,330,bw-40,380,{a:an});btns.push({x:bx+bw/2,y:330,r:200,id:'cdino',fn:()=>{C.roarT=T;roar(DD[id].roar[0],DD[id].roar[1]);setTimeout(()=>say(DD[id].name+'! '+DD[id].facts.join(' ')),700)}});
  const rx=VW*.6,rw=VW*.33;txt(DD[id].name,rx+rw/2,150,Math.min(46,rw/8),'#fff');

  for(let i=0;i<DD[id].tr.length;i++){const k=DD[id].tr[i];c.save();c.translate(rx+rw/2+i*80,305);c.scale(.5,.5);if(!SAVE[PL].tr[k])c.globalAlpha=.25;ICON[k]();c.restore()}
  sizeCompare(id,rx,365,rw,190);
  updFX(dt);
  button(VW/2-90,650,52,'museum',()=>goMuseum(),{is:.0115});button(VW/2+90,650,56,'next',()=>{hush();goMap()},{is:.013,pulse:1,col:'#fff'});
  drawDinko(70,VH-10,.62)}

/* ================= MÚZEUM ================= */
function goMuseum(){go('museum');hush();MU={sel:null,t:0};const n=ORDER.filter(k=>SAVE[PL].done[k]).length;say(n?'Toto je tvoje múzeum. Ťukni na dinosaura alebo na poklad.':'Múzeum je zatiaľ prázdne. Poď kopať!')}

  const cw=Math.min(300,(VW-120)/3),ch=200,x0=VW/2-cw*1.5;

  const ty=VH-70,tw=Math.min(110,(VW-300)/6);P();rr(VW/2-tw*3-14,ty-52,tw*6+28,104,22);FS('rgba(255,250,235,.85)',4);
  TRK.forEach((k,i)=>{const x=VW/2-tw*2.5+i*tw,n=sv.tr[k]||0;c.save();c.translate(x,ty);c.scale(.5,.5);if(!n)c.globalAlpha=.22;ICON[k]();c.restore();if(n>1)txt('×'+n,x+30,ty+30,22,'#fff');
    btns.push({x,y:ty,r:tw/2,id:'tr'+k,fn:()=>{if(n)say(TR[k].n+'. '+TR[k].f);else{SFX.wrong();say('Tento poklad ešte nemáš. Hľadaj ho pri kopaní!')}}})});
  updFX(dt);homeBtn(()=>{hush();goMap()})}

/* ================= SLUČKA ================= */
let last=0;
function drawIcon(){c.fillStyle=grad('#ffd9a8','#f3b866',0,VH);c.fillRect(0,0,VW,VH);P();E(VW/2,VH*.98,VW*.7,VH*.3);c.fillStyle='#c99c66';c.fill();
  c.save();c.translate(VW*.3,VH*.85);c.rotate(-.3);icon('bone',0,0,2.2);c.restore();fitDino('tri',VW*.52,VH*.5,VW*.9,VH*.78,{a:{}})}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;btns=[];c.setTransform(S,0,0,S,0,0);LC=OL;
  try{
    if(location.hash==='#icon')drawIcon();
    else if(scr==='splash'){drawSplash();updFX(dt)}
    else if(scr==='who'){drawWho();updFX(dt)}
    else if(scr==='map'){drawMap(dt);updFX(dt)}
    else if(scr==='dig')drawDig(dt);

    else if(scr==='museum')drawMuseum(dt);
  }catch(e){console.error(e)}
  if(fade>0){fade=Math.max(0,fade-dt*3);c.fillStyle='rgba(255,248,232,'+fade+')';c.fillRect(0,0,VW,VH)}
  musicTick()}
function toV(e){return {x:e.clientX*DPR/S,y:e.clientY*DPR/S}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(hyp(b.x-p.x,b.y-p.y)<b.r)return b}return null}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toV(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const b=hitBtn(p);
  if(b&&!(scr==='build'&&b.id==='cdino')){if(scr==='run'&&!b.id.startsWith('home')&&b.id!=='home'){}else{press={id:b.id,fn:b.fn,x:b.x,y:b.y,r:b.r};return}}
  if(scr==='dig')digDown(p);else if(scr==='build')buildDown(p);else if(scr==='run')runDown(p)});
cv.addEventListener('pointermove',e=>{const p=toV(e);if(scr==='dig')digMove(p);else if(scr==='build')buildMove(p);else if(scr==='run')runMove(p)});
cv.addEventListener('pointerup',e=>{const p=toV(e);prime();if(press){const pr=press;press=null;if(hyp(pr.x-p.x,pr.y-p.y)<pr.r+30){SFX.tap();pr.fn()}return}
  if(scr==='dig'&&DG)DG.dig=null;else if(scr==='build')buildUp(p);else if(scr==='run')runUp()});
cv.addEventListener('pointercancel',()=>{press=null;if(DG)DG.dig=null;if(BD)BD.drag=null;if(RN)RN.hold=false});
addEventListener('touchend',()=>{ac();prime()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
const FSC={on:()=>document.fullscreenElement||document.webkitFullscreenElement,can:()=>document.fullscreenEnabled||document.webkitFullscreenEnabled,land:()=>innerWidth>innerHeight};
function fsGo(){if(!FSC.can()||FSC.on()||!FSC.land())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
['pointerup','touchend'].forEach(ev=>addEventListener(ev,fsGo,true));
if(location.hash==='#icon'){const r=document.getElementById('rot');if(r)r.remove()}
resize();requestAnimationFrame(frame);
