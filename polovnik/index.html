<style>
/* Layout: celoobrazovková krajina na plátne; ovládanie ako tmavé sklo poľovníckej výstroje, pokyny len ikonami v ľavom hornom rohu. */
:root{
  --glass:rgba(18,22,15,.66); --glass2:rgba(18,22,15,.82); --line:rgba(236,229,210,.32); --ink:#ece5d2; --dim:#a9a28f;
  --ok:#7fb04a; --no:#d0583c; --gold:#d9a83a; --moss:#2e3a24;
  --f:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#1d2417}
body{font-family:var(--f);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100vw;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.glass{background:var(--glass);border:2px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#top>*{pointer-events:auto}
.tb{width:54px;height:54px;border-radius:16px;padding:9px}
.tb:active{transform:scale(.94)}
.tb canvas{width:100%;height:100%;display:block}
.lft{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#hint{display:flex;gap:8px;padding:6px;border-radius:18px}
#hint canvas{width:clamp(52px,8.5vh,74px);height:clamp(52px,8.5vh,74px);display:block}
#hint:empty{display:none}
#chip{display:flex;align-items:center;gap:10px;border-radius:16px;padding:4px 14px 4px 6px;font-weight:700;font-size:24px;line-height:1;min-width:0}
#chip canvas{width:44px;height:44px}
#chip .st{color:var(--gold);font-size:22px;letter-spacing:1px}
#chip .sc{font-variant-numeric:tabular-nums}
#chip .cl{width:24px;height:24px;opacity:.8}
.tr{display:flex;gap:10px}.hr{display:flex;gap:10px}
#panel{position:fixed;inset:0;z-index:4;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(84px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
#panel.mid{align-items:center}
#panel .w{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%;animation:pop .25s ease-out}
#panel .w.pass{pointer-events:none}#panel .w.pass .btn{pointer-events:auto}
@keyframes pop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;gap:clamp(8px,1.6vw,16px);align-items:center;justify-content:center;flex-wrap:nowrap}
.btn{border-radius:22px;width:clamp(76px,14vw,136px);aspect-ratio:1;padding:10px;position:relative;flex:none;background:var(--glass2);border:2px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn canvas{width:100%;height:100%;display:block;pointer-events:none}
.btn.big{width:clamp(104px,19vw,180px)}
.btn.huge{width:clamp(130px,26vh,220px)}
.btn.ok{border-color:var(--ok);box-shadow:0 0 0 4px rgba(127,176,74,.35) inset}
.btn.no{border-color:var(--no);animation:shake .35s}
.btn.dim{opacity:.35}
.btn.ct{width:clamp(130px,20vw,230px);aspect-ratio:1.05;padding:6px}.btn.ct canvas{width:100%;height:100%;border-radius:16px;display:block}
.btn.tab{width:clamp(56px,9vw,92px);aspect-ratio:1.05;padding:4px}.btn.tab canvas{width:100%;height:100%;border-radius:12px;display:block}
.conts{flex-wrap:wrap}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(217,168,58,.25)}}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.card{border-radius:26px;padding:clamp(12px,2.4vh,22px) clamp(14px,3vw,28px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,14px);max-width:min(94vw,820px);max-height:calc(100vh - 110px);overflow:auto;background:var(--glass2);border:2px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card h1{margin:0;font-size:clamp(34px,6.5vh,58px);line-height:1;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-align:center}
.card h1.g{color:#b7dc7d}.card h1.r{color:#f0a184}
.card .pic{width:clamp(180px,38vh,340px);aspect-ratio:1.35;max-width:72vw;border-radius:18px;background:radial-gradient(ellipse at 50% 70%,rgba(160,170,120,.28),rgba(0,0,0,0) 70%)}
.pts{font-size:clamp(28px,5vh,42px);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.checks{display:flex;gap:10px}
.checks canvas{width:clamp(46px,8vh,66px);height:clamp(46px,8vh,66px)}
.map{width:min(84vw,calc((100vh - 130px) * 1.35));aspect-ratio:1.35;border:2px solid var(--line);border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.45);touch-action:none;display:block}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.6vw,14px);width:min(88vw,760px)}
.plq{background:linear-gradient(#5b3d24,#3d2816);border-radius:18px 18px 34px 34px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid rgba(0,0,0,.35);min-width:0}
.plq canvas{width:100%;aspect-ratio:1.2;background:radial-gradient(ellipse at 50% 60%,#e7dcc2,#c9b993);border-radius:14px}
.plq b{color:#f3e6c6;font-size:clamp(20px,3.6vh,30px);font-variant-numeric:tabular-nums}
.rank{display:flex;flex-direction:column;align-items:center;gap:4px}
.rank .st{font-size:clamp(28px,5vh,44px);color:var(--gold);letter-spacing:4px}
.rank .nm{font-size:clamp(24px,4vh,34px);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.bar{width:min(60vw,380px);height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5d8a36,#a7cf6a)}
.title{font-size:clamp(48px,11vh,96px);font-weight:700;color:#f3ead2;text-shadow:0 4px 30px rgba(0,0,0,.6);line-height:.95;text-align:center;text-transform:uppercase;letter-spacing:2px}
.who{display:flex;gap:clamp(20px,5vw,60px)}
.who .btn{width:clamp(150px,30vh,250px)}
#rot{position:fixed;inset:0;z-index:20;background:#1d2417;color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:26px;font-weight:700;text-align:center;padding:24px}
#rot .ph{width:70px;height:120px;border:6px solid var(--ink);border-radius:16px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.pulse,#rot .ph,#panel .w{animation:none}}
</style>

<script>
"use strict";
/* ================= základ ================= */
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
const bgC=document.createElement('canvas'),bgX=bgC.getContext('2d');
const fgC=document.createElement('canvas'),fgX=fgC.getContext('2d');
const mkC=document.createElement('canvas'),mkX=mkC.getContext('2d');
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ell(c,x,y,rx,ry,rot=0){c.moveTo(x+Math.cos(rot)*Math.abs(rx),y+Math.sin(rot)*Math.abs(rx));c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU)}
const hx2=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
function mix(a,b,t){const A=hx2(a),B=hx2(b);return'#'+((1<<24)|(Math.round(lerp(A[0],B[0],t))<<16)|(Math.round(lerp(A[1],B[1],t))<<8)|Math.round(lerp(A[2],B[2],t))).toString(16).slice(1)}
const shade=(h,k)=>k<0?mix(h,'#000000',-k):mix(h,'#ffffff',k);
const rgba=(h,a)=>{const A=hx2(h);return`rgba(${A[0]},${A[1]},${A[2]},${a})`};
const rot=(x,y,a)=>({x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)});

/* ================= hlas a zvuk ================= */
let skVoice=null,lastLine='';
function pickVoice(){try{const vs=speechSynthesis.getVoices();skVoice=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){lastLine=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skVoice)u.voice=skVoice;u.rate=1.02;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
let AC=null,NB=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*1.2;NB=AC.createBuffer(1,n,AC.sampleRate);try{const k=AC.createDynamicsCompressor();k.threshold.value=-10;k.ratio.value=6;k.attack.value=.002;k.release.value=.2;const mg=AC.createGain();mg.gain.value=1.6;k.connect(mg).connect(AC.destination);AC.out=k}catch(_){}const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.2,when=0,f2){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.out||a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v,fq,when=0,hp){const a=ac();if(!a)return;const t=a.currentTime+when,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type=hp?'highpass':'lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.out||a.destination);s.start(t);s.stop(t+d+.05)}
const SFX={
  tap(){tone(700,.06,'triangle',.07)},
  good(){[523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.07))},
  bad(){tone(300,.2,'sine',.13);tone(220,.3,'sine',.13,.16)},
  fan(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.08))},
  chirp(){const b=rnd(2400,3600);for(let i=0;i<pick([2,3]);i++)tone(b,.08,'sine',.03,i*.12,b*1.4)},
  snort(){noise(.3,.35,700)},rustle(){noise(.4,.06,3000,0,1)},step(){noise(.08,.05,1200)},
  pop(){tone(500,.12,'square',.07,0,1200);[880,1175,1568].forEach((f,i)=>tone(f,.25,'sine',.11,.08+i*.07))},
  shot(w){ac();if(w==='brok'){noise(.07,1,8000);noise(.25,1,2500);noise(.8,.8,1000,.01);tone(100,.3,'triangle',.5,0,45)}else if(w==='puska'){noise(.09,1,9000);noise(.18,1,3500);noise(1.1,.9,1200,.01);tone(120,.4,'triangle',.6,0,45);noise(1.4,.35,600,.25)}else if(w==='vzduch'){noise(.06,.9,8000,0,1);noise(.15,.7,3000);tone(420,.05,'square',.2)}else if(w==='kusa'){tone(220,.07,'square',.45);noise(.05,.9,6000,0,1);noise(.35,.5,3000,.02,1);tone(110,.2,'triangle',.4,.01,70)}else{tone(160,.22,'triangle',.55,0,90);noise(.06,.7,5000,0,1);noise(.4,.4,2500,.03,1)}},
  thud(){tone(120,.15,'sine',.2,0,70)},
  reload(w){const ck=(t,f)=>{noise(.05,.25,f||3500,t,1);tone(1800,.03,'square',.04,t)};if(w==='puska'){ck(.1);ck(.35,2500);ck(.6);ck(.85,2500)}else if(w==='vzduch'){ck(.15,2000);ck(.6,3000)}else if(w==='brok'){ck(.08,1800);ck(.4);ck(.55);ck(.95,1800)}else if(w==='kusa'){tone(300,.5,'sawtooth',.03,.1,500);ck(.7)}else{noise(.3,.08,4000,.1,1);ck(.5,5000)}},tick(){tone(1400,.03,'sine',.04)}
};

/* ================= ukladanie ================= */
const KEY='malyPolovnik.v1';
const RESET_AT=1794950266000;/* vynulovanie zbierok 17.11.2026 */
const blank=()=>({v:1,updated:0,matko:{score:0,hunts:0,tro:{},good:0},adamko:{st:{},n:0}});
let SAVE=blank(),dbDoc=null,cloud=false,writing=false,pend=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1&&(s.updated||0)>=RESET_AT)SAVE=Object.assign(blank(),s)}catch(e){}
function save(){SAVE.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}pushCloud()}
async function pushCloud(){if(!dbDoc)return;if(writing){pend=true;return}writing=true;try{await dbDoc.set(JSON.parse(JSON.stringify(SAVE)))}catch(e){}writing=false;if(pend){pend=false;pushCloud()}}
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r('t'),ms))]);
(async function(){
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;dbDoc=db.doc('data/users/'+id+'/postup');
    const sn=await tmo(dbDoc.get(),10000);
    if(sn.exists){const d=sn.data();if(d&&d.v===1&&(d.updated||0)>=RESET_AT&&(d.updated||0)>(SAVE.updated||0)){SAVE=Object.assign(blank(),d);try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}}
    cloud=true;if(SAVE.updated)pushCloud();refreshChip();if(G.phase==='hub')showHub();
  }catch(e){}
})();

/* ================= údaje ================= */
const RANKS=[{n:'Nováčik',p:0},{n:'Pomocník',p:120},{n:'Strelec',p:300},{n:'Lovec',p:600},{n:'Majster poľovník',p:1000}];
const rankOf=s=>{let r=0;RANKS.forEach((k,i)=>{if(s>=k.p)r=i});return r};
const SEAS=['jar','leto','jesen','zima'];
const SPEC={
  jelen:{type:'q',bl:112,bh:52,L:70,hl:44,hw:20,ear:.42,dors:'#5c3a22',col:'#8a5a35',belly:'#c7a57c',leg:'#6a4a30',neck:'#4c3020',rump:'#d9c49a',w:{dors:'#4d4034',col:'#6e5d4b',belly:'#a69886',neck:'#3e3328'},antler:2,mul:1,th:255,speed:26},

  zubor:{type:'z',bl:132,bh:68,L:42,dors:'#2a1c10',col:'#5c3e24',belly:'#3a2816',leg:'#2a1c10',tip:'#8a6440',m:1.6,mul:.95,th:140,speed:22},
  diviak:{type:'b',bl:98,bh:54,L:30,dors:'#231c17',col:'#3d332a',belly:'#4f4337',tip:'#7a6b5c',mul:1.15,th:115,speed:22},
  zajac:{type:'h',bl:58,bh:34,dors:'#6c5843',col:'#8c7459',belly:'#e8dfcf',mul:1.7,th:100,speed:34}
};
const AN={
  jelen:{acc:'jeleňa',wp:{puska:10,kusa:0,luk:0,vzduch:0},facts:['Jeleň je najväčšia zver v našich lesoch.','Jeleňovi každú jar opadajú parohy a narastú mu nové.','Na jeseň jelene ručia. Je to ich hlasné volanie.']},

let fsLand=FS.land();const fsRot=()=>{const l=FS.land();if(l===fsLand)return;fsLand=l;if(l)fsGo();else fsExit()};
addEventListener('resize',fsRot);addEventListener('orientationchange',()=>setTimeout(fsRot,300));
cv.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY;
  if(G.phase==='aim'&&!aim.locked){aim.drag={x,y,ax:aim.x,ay:aim.y};aim.touch=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else if(G.phase==='sneak'){sneakDown(x,y);try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else if(G.phase==='atap')aTap(x,y)});
cv.addEventListener('pointermove',e=>{if(G.phase==='sneak'){sneakMove(e.clientX);return}if(!aim.drag)return;const d=aim.drag;aim.x=clamp(d.ax+e.clientX-d.x,W*.02,W*.98);aim.y=clamp(d.ay+e.clientY-d.y,H*.06,H*.97)});
const endDrag=()=>{aim.drag=null;aim.touch=false;G.drag=0};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* --- výsledok --- */
function result(res){if(hunt&&hunt.easy){G.hid++;G.phase='result';hint([]);const sp=tgt?tgt.sp:hunt.sp,hit=res==='hit',s=SAVE.adamko;
    if(hit){s.st[sp]=(s.st[sp]||0)+1;s.n++;save();refreshChip();SFX.fan()}else SFX.tap();
    const ck=[[hunt.weapon||'puska',1],['wind',1],[hunt.stance||'stoj',1],['hunter',1],['srdce',hit]];
    show('<div class="card"><h1 class="g">'+(hit?'Ulovené!':'Skoro!')+'</h1><canvas class="pic" data-an="'+sp+'" data-season="'+hunt.season+'"'+(tgt&&tgt.female?' data-female="1"':'')+'></canvas>'+
      '<div class="checks">'+ck.map(k=>'<canvas data-ck="'+k[0]+'" data-ok="'+(k[1]?1:0)+'"></canvas>').join('')+'</div><div class="pts">★ '+s.n+'</div>'+
      '<div class="row"><button class="btn" data-a="home" aria-label="Domov"><canvas data-ic="home"></canvas></button><button class="btn" data-a="retry" aria-label="Znova to isté zviera"><canvas data-ic="replay"></canvas></button><button class="btn big pulse" data-a="hunt" aria-label="Ďalšie zviera"><canvas data-ic="next"></canvas></button></div></div>',1);
    say((hit?pick(APR)+' To je '+ANAME[sp]+'. '+(AN[sp]?pick(AN[sp].facts):''):'Skoro!')+' Ťukni na šípku a choď na ďalšie zviera.');return}
  G.hid++;G.phase='result';const m=SAVE.matko,before=rankOf(m.score),sp=tgt?tgt.sp:hunt.sp,P=hunt.pts;let gain=0,title,tc='r',line;m.hunts++;
  const prep=(hunt.noPrep?0:P.w+P.v+P.s)+P.sn;
  if(res==='hit'){gain=prep+P.shot;m.tro[sp]=(m.tro[sp]||0)+1;title='Ulovené!';tc='g';SFX.fan();line='Ulovené! Výborná rana! '+(AN[sp]?pick(AN[sp].facts):'')}
  else if(res==='goodLeave'){gain=prep+P.leave;m.good++;title='Správne!';tc='g';line='Body za to, že si ho nechal ísť. '+(AN[sp]&&AN[sp].facts?pick(AN[sp].facts):'')}
  else{gain=Math.round(prep/3);title={fled:'Ušlo!',blocked:'Ušlo!',miss:'Vedľa!',badHit:'Ušlo!',woundEsc:'Ušlo!',wrongShoot:'Pozor!',missedChance:'Nabudúce!',timeout:'Odišlo!'}[res];
    line={fled:'Zviera ťa videlo a utieklo. Choď, len keď sa pasie.',blocked:'Trafil si strom alebo kameň.',miss:'Vedľa!',badHit:'Rana nebola dobrá. Mier na srdce.',woundEsc:'Zranené zviera ušlo. Druhou ranou ho musíš trafiť.',wrongShoot:encWhy(),missedChance:'Toto zviera sa smelo loviť.',timeout:'Zviera odišlo.'}[res];SFX.bad()}
  m.score+=gain;save();refreshChip();const after=rankOf(m.score);hint([]);const fail=res!=='hit'&&res!=='goodLeave';line+=' Ťukni na dvojitú šípku a choď na ďalšie zviera.';
  const ck=[[hunt.weapon||'puska',P.w>0],['wind',P.v>0],[hunt.stance||'stoj',P.s>=6]];if(['hit','miss','badHit','blocked','fled','woundEsc'].includes(res))ck.push(['hunter',P.sn>0]);
  if(['hit','miss','badHit','blocked','woundEsc'].includes(res))ck.push(['srdce',res==='hit']);if(['goodLeave','wrongShoot','missedChance'].includes(res))ck.push(['nechat',res==='goodLeave']);
  show('<div class="card"><h1 class="'+tc+'">'+title+'</h1><canvas class="pic" data-an="'+sp+'" data-season="'+hunt.season+'"'+(tgt&&tgt.young?' data-young="1"':'')+(tgt&&tgt.female?' data-female="1"':'')+'></canvas>'+
    '<div class="checks">'+ck.map(k=>'<canvas data-ck="'+k[0]+'" data-ok="'+(k[1]?1:0)+'"></canvas>').join('')+'</div><div class="pts">+'+gain+'</div>'+
    '<div class="row"><button class="btn" data-a="home" aria-label="Domov"><canvas data-ic="home"></canvas></button>'+'<button class="btn" data-a="retry" aria-label="Znova to isté zviera"><canvas data-ic="replay"></canvas></button><button class="btn big pulse" data-a="hunt" aria-label="Ďalšie zviera"><canvas data-ic="next"></canvas></button>'+'</div></div>',1);
  if(after>before){line+=' Hurá! Si '+RANKS[after].n+'!';later(()=>SFX.fan(),900)}say(line)}
ACT.home=()=>G.player==='matko'?showHub():aHub();
function restartHunt(){if(!hunt||!hunt.weapon)return;try{speechSynthesis.cancel()}catch(e){}
  if(!hunt.stance){G.hid++;hunt.noPrep=true;scene.lane=null;hunter=null;animals=[];tgt=null;showWind();return}ACT.retry()}
ACT.retry=()=>{G.hid++;hunt.noPrep=true;hunt.pts.sn=0;hunt.pts.shot=0;hunt.pts.leave=0;hunt.det=0;hunt.alerts=0;hunt.alerted=0;aim.fx=null;aim.locked=false;
  makeScene(hunt.season,hunt.terr,{path:hunt.enc==='unsafe',seed:hunt.seed,cont:hunt.cont});makeWorldCovers();animals=[];tgt=null;person=null;hunter=null;startSneak()};

/* ================= Adamko ================= */
const APR=['Hurá! Super, Adamko!','Bravó Adamko!','Výborne! Ty si šikovný!','Juchú! Podarilo sa!','Paráda!'];
const ANAME=NAME;
function aHub(greet){G.hid++;G.phase='ahub';tgt=null;person=null;hunter=null;hint([]);calmScene(pick(SEAS));refreshChip();
  show('<div class="row"><button class="btn huge pulse" data-a="pick" aria-label="Hrať"><canvas data-ic="go"></canvas></button><button class="btn big" data-a="tro" aria-label="Zvieratká"><canvas data-ic="trofej"></canvas></button></div>',1);
  if(greet)say('Ahoj Adamko! Poď hľadať zvieratká.')}
ACT.aplay=()=>startHunt();
function aStart(){G.hid++;clearPanel();hint([]);const sp=pick(CONT.eu.hunt);makeScene(pick(SEAS),'luka',{gy:.78,dist:1.05});const dir=Math.random()<.5?1:-1;
  tgt=newAnimal(sp,{fx:dir>0?-.08:1.08,dir,tx:.5,state:'walk',spd:SPEC[sp].speed*.8,female:sp==='srnec'});animals=[tgt];person=null;hunter=null;
  if(Math.random()<.35&&sp!=='zajac'&&sp!=='liska')animals.push(newAnimal(sp,{fx:tgt.fx-dir*.14,dir,tx:.5-dir*.15,state:'walk',spd:tgt.spd,young:true}));
  G.phase='awalk';G.aR=1;G.aIdle=0;SFX.rustle();say('Pozri, ide '+ANAME[sp]+'!')}
function updA(dt){if(G.phase==='awalk'&&tgt.state==='stand'){G.phase='atap';G.aIdle=0;hint(['strielat']);say('Ťukni na krúžok!')}
  if(G.phase==='atap'){G.aIdle+=dt;if(G.aIdle>6){G.aIdle=0;G.aR=Math.min(2.2,G.aR*1.2);say('Ťukni na krúžok, Adamko!')}}}
function aRing(){const b=bodyOf(tgt);return{x:b.x,y:b.y,r:Math.max(H*.11,b.ry*1.4)*G.aR}}
function aTap(x,y){if(G.phase!=='atap')return;const r=aRing();if(Math.hypot(x-r.x,y-r.y)<r.r*1.35){G.phase='ahit';SFX.pop();aim.fx={x,y,t:0,w:'pop',hit:1};tgt.jump=0;tgt.jt=0;tgt.hu=1.3;
    for(let i=0;i<40;i++)parts.push({x,y,vx:rnd(-260,260),vy:rnd(-380,-60),r:rnd(3,6),k:'star',col:pick(['#e3b23c','#f6d34a','#ffffff','#e8822f','#9cc860']),rot:0,ph:0,g:1});
    const s=SAVE.adamko;s.st[tgt.sp]=(s.st[tgt.sp]||0)+1;s.n++;save();refreshChip();later(aCard,1100)}
  else{G.aR=Math.min(2.2,G.aR*1.25);G.aIdle=0;SFX.tap();say(pick(['Skoro! Ešte raz.','Ťukni na krúžok!']))}}
function aCard(){G.phase='acard';SFX.fan();hint([]);const sp=tgt.sp;
  show('<div class="card"><h1 class="g">Hurá!</h1><canvas class="pic" data-an="'+sp+'" data-season="'+scene.season+'"'+(tgt.female?' data-female="1"':'')+'></canvas><div class="pts">★ '+SAVE.adamko.n+'</div><div class="row"><button class="btn huge pulse" data-a="aplay" aria-label="Ďalej"><canvas data-ic="play"></canvas></button></div></div>',1);
  say(pick(APR)+' To je '+ANAME[sp]+'.')}

/* ================= gyroskop ================= */
function onMotion(e){const r=e.rotationRate;if(!r||r.alpha===null)return;const m=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0);if(!isFinite(m))return;gotMotion=true;motion=Math.max(motion,m)}
function initMotion(){try{if(typeof DeviceMotionEvent==='undefined')return;const go=()=>{addEventListener('devicemotion',onMotion);setTimeout(()=>{gyro=gotMotion},1500)};
  if(typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().then(s=>{if(s==='granted')go()}).catch(()=>{});else go()}catch(e){}}

/* ================= slučka ================= */
function updAnimals(dt){for(const a of animals){
  if(a.state==='walk'||a.state==='flee'){const S=SPEC[a.sp],p=aPos(a),v=a.spd*2.6*p.s/W,d=a.tx-a.fx;
    if(Math.abs(d)<v*dt*1.5){a.fx=a.tx;if(a.state==='walk')a.state='stand';else a.gone=1}else{a.fx+=Math.sign(d)*v*dt;a.dir=Math.sign(d)}
    if(a.state==='flee'&&S.fly)a.alt=(a.alt||0)+dt*140;
    a.ph+=dt*a.spd*2.6/(S.bl*.17)*(a.state==='flee'?.6:1);if(G.phase!=='sneak')a.hu=a.state==='flee'?1.15:lerp(a.hu,1,dt*2)}
  else if(a.state==='stand'&&!['sneak','aim','decide','look','binoc','hit','atap','ahit','reload'].includes(G.phase)){a.hu=lerp(a.hu,Math.sin(G.t*.7+a.seed)>.5?.12:1,dt*1.5)}
  if(a.jump!==undefined){a.jt=(a.jt||0)+dt;a.jump=a.jt<1.3?Math.max(0,Math.sin(a.jt*7))*26:0}
  if(a.amb&&(a.fx>1.25||a.fx<-.25))Object.assign(a,ambient())}
  animals=animals.filter(a=>!a.gone||a===tgt);if(person){person.fx+=person.dir*person.spd*dt;if(person.fx>1.2||person.fx<-.2)person.dir*=-1}}
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;G.t+=dt;motion*=Math.pow(.02,dt);
  if(G.phase==='sneak')updSneak(dt);if(G.phase==='aim')updAim(dt);if(G.phase==='awalk'||G.phase==='atap')updA(dt);
  updAnimals(dt);spawnParts(dt);
  let tz=1,tcx=W/2,tcy=H/2;
  if(tgt&&(G.phase==='look'||G.phase==='decide')){const b=bodyOf(tgt);tz=2.2;tcx=b.x;tcy=b.y-b.ry*.3;if(person||hunt.enc==='mother'){tz=1.7;tcy=b.y-b.ry*.8}}
  if(tgt&&(G.phase==='aim'||G.phase==='hit'||G.phase==='reload')){tz=aim.cz;tcx=aim.ccx;tcy=aim.ccy}
  if(tz>1){tcx=clamp(tcx,W/2/tz,W-W/2/tz);tcy=clamp(tcy,H/2/tz,H-H/2/tz)}
  const k=Math.min(1,dt*4);cam.z+=(tz-cam.z)*k;cam.cx+=(tcx-cam.cx)*k;cam.cy+=(tcy-cam.cy)*k;
  const re=!!G.player&&hunt&&hunt.weapon&&!['hub','tro','select','start','weapon','ahub','acard','cont','cont2'].includes(G.phase);if(bRe.hidden===!!re){bRe.hidden=!re;if(re)paintIcons(bRe)}
  draw(dt);if(G.phase==='wind')drawMap(G.t);requestAnimationFrame(frame)}
const bRe=$('#bRe');
function draw(dt){const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#1d2417';c.fillRect(0,0,W,H);if(!scene)return;
  c.save();c.translate(W/2,H/2);c.scale(cam.z,cam.z);c.translate(-cam.cx,-cam.cy);drawWorld(c);c.restore();
  if(G.phase==='atap'){const r=aRing(),pu=1+Math.sin(G.t*5)*.06;c.strokeStyle='#f2cf4a';c.lineWidth=7;c.shadowColor='rgba(242,207,74,.8)';c.shadowBlur=16;c.beginPath();ell(c,r.x,r.y,r.r*pu,r.r*pu);c.stroke();c.lineWidth=3;c.strokeStyle='#fff';c.beginPath();ell(c,r.x,r.y,r.r*.5*pu,r.r*.5*pu);c.stroke();c.shadowBlur=0}
  rest(c,dt)}
function drawWorld(c){c.drawImage(bgC,0,0,W,H);
  if(person){const s=H*.0017*scene.dist*.95;c.save();c.translate(person.fx*W,scene.gy*H-H*.06);c.scale(person.dir*s,s);drawPerson(c,G.t);c.restore()}
  const wc=scene.wcov||[];wc.filter(k=>k.t==='tree').forEach(k=>drawCover(c,k));
  animals.slice().sort((a,b)=>(a.young?0:1)-(b.young?0:1)).forEach(a=>drawAnimal(c,a,G.t));
  wc.filter(k=>k.t!=='tree').forEach(k=>drawCover(c,k));
  drawObstr(c,G.t);
  if((G.phase==='aim'||G.phase==='reload')&&tgt&&!tgt.dead){const z=zoneOf(tgt);c.strokeStyle='rgba(235,45,30,.9)';c.setLineDash([6/cam.z,4/cam.z]);c.lineWidth=2.6/cam.z;c.beginPath();ell(c,z.x,z.y,z.rx,z.ry);c.stroke();c.setLineDash([])}}
function rest(c,dt){
  if(!(G.phase==='look'||G.phase==='decide'))c.drawImage(fgC,0,0,W,H);
  if(G.phase==='sneak')drawLane(c,G.t);
  drawParts(c);
  if(G.phase==='look'||G.phase==='decide'){mkX.setTransform(DPR,0,0,DPR,0,0);mkX.globalCompositeOperation='source-over';mkX.fillStyle='#0a0d08';mkX.fillRect(0,0,W,H);mkX.globalCompositeOperation='destination-out';
    const r=Math.min(H*.44,W*.27);mkX.beginPath();ell(mkX,W/2-r*.82,H/2,r,r);mkX.fill();mkX.beginPath();ell(mkX,W/2+r*.82,H/2,r,r);mkX.fill();c.drawImage(mkC,0,0,W,H)}
  if(G.phase==='aim'||G.phase==='hit'||G.phase==='reload')drawScope(c,dt);else if(aim.fx)drawFx(c,dt)}
function drawScope(c,dt){const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=g;c.fillRect(0,0,W,H);
  if(G.phase==='aim'||G.phase==='hit'){const p=aim.fx?{x:aim.fx.x,y:aim.fx.y}:aimPoint();drawLoupe(c,p)}
  if(G.phase==='reload')drawReload(c,dt);
  drawFx(c,dt)}
function drawLoupe(c,p){const r=Math.min(H*.15,W*.13),Z=2.4;const lx=p.x,ly=p.y;
  const w=toWorld(p);c.save();c.beginPath();ell(c,lx,ly,r,r);c.clip();c.fillStyle='#1d2417';c.fillRect(lx-r,ly-r,r*2,r*2);
  c.translate(lx,ly);c.scale(cam.z*Z,cam.z*Z);c.translate(-w.x,-w.y);drawWorld(c);c.restore();
  c.strokeStyle='rgba(10,10,10,.85)';c.lineWidth=1.5;c.beginPath();c.moveTo(lx-r,ly);c.lineTo(lx-6,ly);c.moveTo(lx+6,ly);c.lineTo(lx+r,ly);c.moveTo(lx,ly-r);c.lineTo(lx,ly-6);c.moveTo(lx,ly+6);c.lineTo(lx,ly+r);c.stroke();
  c.fillStyle='#e0321e';c.beginPath();ell(c,lx,ly,3,3);c.fill();
  c.lineWidth=7;c.strokeStyle='rgba(18,22,15,.9)';c.beginPath();ell(c,lx,ly,r,r);c.stroke();
  if(aim.p>0){c.strokeStyle=aim.on===2?'#8fd85a':'#f2c14a';c.lineWidth=5;c.beginPath();c.arc(lx,ly,r-6,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,aim.p));c.stroke()}}
function drawReload(c,dt){aim.rl+=dt;const t=Math.min(1,aim.rl/1.2),s=H*.3,x0=W-s-H*.04,y0=H-s-H*.04,wp=hunt.weapon;
  c.save();c.fillStyle='rgba(18,22,15,.75)';rr(c,x0-10,y0-10,s+20,s+20,22);c.fill();c.strokeStyle='rgba(236,229,210,.35)';c.lineWidth=2;c.stroke();
  c.strokeStyle='#d9a83a';c.lineWidth=5;c.beginPath();c.arc(x0+s/2,y0+s/2,s*.46,-Math.PI/2,-Math.PI/2+TAU*t);c.stroke();
  c.translate(x0,y0);c.scale(s/100,s/100);const k=Math.sin(Math.min(1,t*1.4)*Math.PI);
  if(wp==='vzduch'||wp==='brok'){c.translate(50,50);c.rotate(-.35*k);c.translate(-50,-50)}else{c.translate(-4*k,0)}
  ICON[wp](c);
  if(wp==='puska'){const cy=lerp(92,48,Math.min(1,t*2));c.fillStyle='#d4a63c';rr(c,46,cy-3,12,6,2);c.fill();c.strokeStyle='#c9cfd2';c.lineWidth=3;c.beginPath();c.moveTo(56-12*k,47);c.lineTo(56-12*k,58);c.stroke()}
  else if(wp==='brok'){const q=Math.min(1,t*2);c.fillStyle='#b8322a';rr(c,lerp(66,40,q),lerp(92,42,q),12,5,2);c.fill();rr(c,lerp(70,40,q),lerp(96,48,q),12,5,2);c.fill();c.fillStyle='#d4a63c';c.fillRect(lerp(66,40,q),lerp(92,42,q),3,5);c.fillRect(lerp(70,40,q),lerp(96,48,q),3,5)}
  else if(wp==='vzduch'){c.fillStyle='#9aa1a5';c.beginPath();ell(c,lerp(70,50,Math.min(1,t*2)),lerp(90,52,Math.min(1,t*2)),3,3);c.fill()}
  else{const ax=lerp(wp==='luk'?-40:130,0,Math.min(1,t*1.6));c.save();c.translate(ax,0);c.strokeStyle='#d9b27a';c.lineWidth=3;c.beginPath();c.moveTo(wp==='luk'?26:52,wp==='luk'?50:49);c.lineTo(94,wp==='luk'?50:49);c.stroke();c.restore()}
  c.restore()}
function drawFx(c,dt){const f=aim.fx;if(!f)return;f.t+=dt;
  if((f.w==='puska'||f.w==='brok')&&f.t<.12){c.fillStyle='rgba(255,250,230,'+(.6-f.t*5)+')';c.fillRect(0,0,W,H)}
  if((f.w==='luk'||f.w==='kusa')&&f.t<WP[f.w].delay){const k=f.t/WP[f.w].delay,sx=W*.7,sy=H*1.05,x=lerp(sx,f.x,k),y=lerp(sy,f.y,k);c.strokeStyle='#5c3b1c';c.lineWidth=4*(1-k*.7);c.beginPath();c.moveTo(x,y);c.lineTo(x+(sx-f.x)*.08*(1-k),y+(sy-f.y)*.08*(1-k));c.stroke()}
  if(f.hit&&f.t<1.1){const k=f.t/1.1;c.strokeStyle='rgba(242,207,74,'+(1-k)+')';c.lineWidth=5;c.beginPath();ell(c,f.x,f.y,18+k*80,18+k*80);c.stroke()}
  if(f.t>1.3)aim.fx=null}

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);mkC.width=Math.round(W*DPR);mkC.height=Math.round(H*DPR);
  cam.z=1;cam.cx=W/2;cam.cy=H/2;if(scene){buildBg();buildFg();if(scene.wcov&&scene.wcov.length)makeWorldCovers()}sizeMap();setTimeout(()=>{paintIcons();hintKey=''},60)}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{speechSynthesis.cancel()}catch(e){}});
resize();showStart();requestAnimationFrame(frame);
</script>
