<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strážcovia tela">
<meta name="theme-color" content="#f7c9b8">

<title>Strážcovia tela</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fbe3d4;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
#rot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:#f7c9b8;display:none;align-items:center;justify-content:center}
#rot .ph{width:80px;height:136px;border:8px solid #3a2530;border-radius:18px;background:#fff6ef;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:1100px){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph"></div></div>
<script>
'use strict';
/* ===== Strážcovia tela – hra pre Maťka a Adamka ===== */
const cv=document.getElementById('c'),c=cv.getContext('2d');
const VH=720,PI=Math.PI,TAU=PI*2,OL='#3a2530';
let VW=1280,S=1,DPR=1,qual=2,T=0,scr='splash',fade=1,btns=[],press=null,PL=null,G=null,I=null,R=null,BK=null,MAPT=0;
const FX=[];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)],hyp=Math.hypot;
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(window.devicePixelRatio||1,qual);cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';S=cv.height/VH;VW=cv.width/S;GR={}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ---------- ukladanie ---------- */
const KEY='strazcoviaTela.v1';
const blank=()=>({snd:1,matko:{lv:{},cards:[],score:0,seen:0,tut:0},adamko:{lv:{},cards:[],score:0,seen:0,tut:0}});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.matko&&s.adamko)return s}catch(e){}return blank()}
let SAVE=load();
function store(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}
const NM={matko:{N:'Maťko',D:'Maťkovi'},adamko:{N:'Adamko',D:'Adamkovi'}};
const tx=s=>s.replace(/\{N\}/g,NM[PL].N).replace(/\{D\}/g,NM[PL].D);

/* ---------- hlas ---------- */
let skV=null,sayTok=0,lastSayAt=-9;
function pickV(){try{const vs=speechSynthesis.getVoices();skV=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
function say(t,cb){const tok=++sayTok;let done=false;lastSayAt=T;const fin=()=>{if(done||tok!==sayTok)return;done=true;if(cb)cb()};
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sk-SK';if(skV)u.voice=skV;u.rate=1;u.pitch=1.08;u.onend=()=>setTimeout(fin,250);speechSynthesis.speak(u)}catch(e){}
  if(cb)setTimeout(fin,1800+t.length*95)}
function speaking(){try{return speechSynthesis.speaking}catch(e){return false}}
function sayQ(t,force){if(force||(!speaking()&&T-lastSayAt>1.2))say(t)}
function hush(){sayTok++;try{speechSynthesis.cancel()}catch(e){}}
let primed=false;function prime(){if(primed)return;primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}

/* ---------- zvuky a hudba ---------- */
let AC=null,OUT=null,MUS=null;
function ac(){if(!AC){try{try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(_){}AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=1;MUS.connect(OUT)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,f2,delay,dest){const a=AC;if(!a||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05)}
let shotN=0;
const SFX={
  tap(){tone(700,.08,'sine',.18,900)},
  shot(){if(++shotN%2)tone(880,.07,'triangle',.05,520)},
  pop(){tone(260,.13,'sine',.3,900);tone(1300,.09,'triangle',.08,1900,.05)},
  hit(){tone(420,.06,'square',.04,300)},
  hurt(){tone(320,.32,'sawtooth',.12,90)},
  yum(){[660,880,1180].forEach((f,i)=>tone(f,.13,'sine',.18,0,i*.07))},
  yuck(){tone(240,.4,'square',.07,110);tone(180,.4,'sawtooth',.05,90,.05)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.18,0,i*.12))},
  boss(){tone(130,.7,'sawtooth',.12,65);tone(98,.7,'square',.06,60,.1)},
  giggle(){[820,1040,860,1120].forEach((f,i)=>tone(f,.07,'sine',.12,0,i*.07))},
  laugh(){[300,260,300,240].forEach((f,i)=>tone(f,.12,'square',.05,f*.8,i*.13))},
  wrong(){tone(330,.16,'sine',.18);tone(250,.3,'sine',.18,0,.16)},
  star(){tone(1320,.3,'sine',.16,1980)},
  right(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.09))}
};
const MEL={menu:[0,4,7,4,9,7,4,2,0,2,4,7,4,2,0,-1],play:[0,0,7,7,9,9,7,-1,5,5,4,4,2,2,0,-1]};
let musStep=0,musNext=0;
function musicTick(){if(!AC||AC.state!=='running'||!SAVE.snd)return;const m=(scr==='play'&&G&&G.phase!=='lose')?MEL.play:MEL.menu,spb=scr==='play'?.2:.26;MUS.gain.value=speaking()?.35:1;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){const n=m[musStep%16],d=musNext-AC.currentTime;if(n>=0)tone(523*Math.pow(2,n/12),spb*.9,'triangle',.035,0,d,MUS);if(musStep%4===0)tone(131*Math.pow(2,[0,5,7,5][(musStep>>4)%4]/12),spb*3,'sine',.07,0,d,MUS);musStep++;musNext+=spb}}

/* ---------- kresliace pomôcky ---------- */
let GR={};
function P(){c.beginPath()}
function E(x,y,rx,ry){c.moveTo(x+rx,y);c.ellipse(x,y,rx,ry,0,0,TAU)}
function FS(f,lw){c.fillStyle=f;c.fill();if(lw!==0){c.lineWidth=lw||4;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(R,r){P();for(let k=0;k<10;k++){const a=-PI/2+k*PI/5,q=k%2?r:R;k?c.lineTo(Math.cos(a)*q,Math.sin(a)*q):c.moveTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
function crescent(R,r,dx,dy){const d=hyp(dx,dy),ph=Math.atan2(dy,dx),al=Math.acos(clamp((d*d+R*R-r*r)/(2*d*R),-1,1));
  const p1x=R*Math.cos(ph+al),p1y=R*Math.sin(ph+al),p2x=R*Math.cos(ph-al),p2y=R*Math.sin(ph-al);const b1=Math.atan2(p1y-dy,p1x-dx),b2=Math.atan2(p2y-dy,p2x-dx);
  P();c.arc(0,0,R,ph+al,ph-al+TAU,false);const span=((b1-b2)%TAU+TAU)%TAU,mid=b2+span/2,cw=Math.cos(mid-(ph+PI))>0;c.arc(dx,dy,r,b2,b1,!cw);c.closePath()}
function hl(x,y,rx,ry,a){P();E(x,y,rx,ry);c.fillStyle='rgba(255,255,255,'+(a||.4)+')';c.fill()}
function eyes(x1,x2,y,er,lx,ly,o){o=o||{};[x1,x2].forEach((x,i)=>{
  if(o.blink||o.closed){P();c.moveTo(x-er,y);c.quadraticCurveTo(x,y+er*(o.closed?.7:.4),x+er,y);c.lineWidth=Math.max(3,er*.22);c.strokeStyle=OL;c.lineCap='round';c.stroke();return}
  P();E(x,y,er,er*1.18);FS('#fff',3);
  P();E(x+lx*er*.38,y+ly*er*.42,er*.52,er*.6);c.fillStyle=o.iris||'#20141c';c.fill();
  P();E(x+lx*er*.38-er*.17,y+ly*er*.42-er*.22,er*.16,er*.16);c.fillStyle='#fff';c.fill();
  if(o.lid){P();c.moveTo(x-er*1.06,y);c.ellipse(x,y,er*1.06,er*1.26,0,PI,TAU);c.closePath();FS(o.lid,3)}
  if(o.angry){P();const s=i?-1:1;c.moveTo(x-s*er*1.1,y-er*1.6);c.lineTo(x+s*er*.9,y-er*.9);c.lineWidth=er*.36;c.strokeStyle=OL;c.lineCap='round';c.stroke()}
  if(o.sad){P();const s=i?-1:1;c.moveTo(x-s*er*1.1,y-er*1.0);c.lineTo(x+s*er*.9,y-er*1.6);c.lineWidth=er*.3;c.strokeStyle=OL;c.lineCap='round';c.stroke()}})}
function grin(x,y,w,open){P();c.moveTo(x-w,y);c.quadraticCurveTo(x,y+w*1.5*open+w*.2,x+w,y);c.quadraticCurveTo(x,y+w*.35,x-w,y);c.closePath();FS('#5b1830',3);
  c.fillStyle='#fff';P();c.moveTo(x-w*.55,y+w*.12);c.lineTo(x-w*.36,y+w*.46);c.lineTo(x-w*.16,y+w*.17);c.closePath();c.moveTo(x+w*.12,y+w*.17);c.lineTo(x+w*.32,y+w*.46);c.lineTo(x+w*.52,y+w*.12);c.closePath();c.fill()}
function txt(s,x,y,size,col,al,lw){c.font='800 '+size+'px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.lineJoin='round';if(lw!==0){c.lineWidth=lw||size*.22;c.strokeStyle=OL;c.strokeText(s,x,y)}c.fillStyle=col||'#fff';c.fillText(s,x,y)}

/* ---------- ikonky (kreslené v štvorci 100×100 so stredom 0,0) ---------- */
const ICON={
  voda(){P();c.moveTo(0,-44);c.bezierCurveTo(8,-28,34,-4,34,16);c.bezierCurveTo(34,36,18,46,0,46);c.bezierCurveTo(-18,46,-34,36,-34,16);c.bezierCurveTo(-34,-4,-8,-28,0,-44);c.closePath();FS('#45a6ee',4);hl(-14,14,6,11,.75)},
  blato(){P();c.moveTo(-44,20);c.bezierCurveTo(-46,-6,-20,-4,-14,-14);c.bezierCurveTo(-4,-30,24,-22,26,-8);c.bezierCurveTo(46,-6,48,22,30,28);c.bezierCurveTo(10,36,-30,36,-44,20);c.closePath();FS('#7b5230',4);c.fillStyle='#5d3b1f';P();E(-10,12,8,5);E(16,4,6,4);c.fill();P();E(6,-12,5,5);E(-22,-2,4,4);FS('#a0703f',2)},
  lizanka(){P();c.moveTo(0,10);c.lineTo(0,48);c.lineWidth=11;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=6;c.strokeStyle='#fff';c.stroke();P();E(0,-14,30,30);FS('#ff6fae',4);P();for(let a=0;a<TAU*2.2;a+=.2){const q=3+a*1.8;const px=Math.cos(a)*q,py=-14+Math.sin(a)*q;a?c.lineTo(px,py):c.moveTo(px,py)}c.lineWidth=5;c.strokeStyle='#fff';c.stroke()},
  cokolada(){c.save();c.rotate(-.25);P();rr(-26,-40,52,80,6);FS('#6b3a1f',4);c.strokeStyle='#4a2612';c.lineWidth=3;P();c.moveTo(0,-40);c.lineTo(0,8);c.moveTo(-26,-16);c.lineTo(26,-16);c.stroke();P();rr(-28,6,56,36,4);FS('#d63c3c',4);c.fillStyle='#ffd23f';c.fillRect(-26,18,52,7);c.restore()},
  mydlo(){P();rr(-38,-4,76,40,14);FS('#f7a8cb',4);hl(-8,8,18,6,.5);[[-18,-22,12],[8,-32,9],[26,-16,7],[-34,-34,6]].forEach(b=>{P();E(b[0],b[1],b[2],b[2]);c.fillStyle='rgba(205,236,255,.75)';c.fill();c.lineWidth=2.5;c.strokeStyle='#4f97d6';c.stroke();hl(b[0]-b[2]*.35,b[1]-b[2]*.35,b[2]*.25,b[2]*.25,1)})},
  kefka(){c.save();c.rotate(-.55);P();rr(-48,-6,64,13,6);FS('#3f8ee8',3.5);P();rr(10,-9,36,16,5);FS('#e9eef5',3.5);P();rr(12,-24,32,16,3);FS('#fff',3);c.strokeStyle='#b8c3d3';c.lineWidth=2;P();for(let k=1;k<5;k++){c.moveTo(12+k*6.4,-23);c.lineTo(12+k*6.4,-9)}c.stroke();
    P();c.moveTo(10,-26);c.bezierCurveTo(14,-44,34,-44,46,-30);c.bezierCurveTo(40,-24,20,-22,10,-26);c.closePath();FS('#fff',3);c.lineWidth=4;P();c.moveTo(16,-32);c.quadraticCurveTo(28,-40,40,-32);c.strokeStyle='#e84a5f';c.stroke();P();c.moveTo(18,-27);c.quadraticCurveTo(30,-33,42,-29);c.strokeStyle='#45a6ee';c.stroke();c.restore()},
  limonada(){P();c.moveTo(-26,-30);c.lineTo(26,-30);c.lineTo(20,44);c.lineTo(-20,44);c.closePath();c.fillStyle='rgba(230,245,255,.95)';c.fill();P();c.moveTo(-23.5,-4);c.lineTo(23.5,-4);c.lineTo(20,44);c.lineTo(-20,44);c.closePath();c.fillStyle='#ff9d2e';c.fill();
    P();c.moveTo(6,-4);c.lineTo(20,-48);c.lineTo(32,-46);c.lineWidth=6;c.strokeStyle='#e8394d';c.lineCap='round';c.stroke();[[-8,14,4],[8,26,3],[-2,34,3],[10,6,3]].forEach(b=>hl(b[0],b[1],b[2],b[2],.85));P();c.moveTo(-26,-30);c.lineTo(26,-30);c.lineTo(20,44);c.lineTo(-20,44);c.closePath();c.lineWidth=4;c.strokeStyle=OL;c.stroke()},
  pomaranc(){P();E(0,6,36,36);FS('#ff9b22',4);c.fillStyle='rgba(190,90,0,.3)';P();E(14,18,2.5,2.5);E(-12,22,2.5,2.5);E(4,30,2.5,2.5);E(20,0,2.5,2.5);c.fill();hl(-14,-6,10,7,.5);P();c.moveTo(0,-30);c.quadraticCurveTo(14,-50,32,-40);c.quadraticCurveTo(16,-26,0,-30);c.closePath();FS('#5bbf3c',3)},
  hranolky(){for(let k=0;k<6;k++){P();rr(-26+k*9.5,-42+(k%2)*9-(k===2?6:0),8.5,52,3);FS('#ffd54a',2.5)}P();c.moveTo(-32,-6);c.lineTo(32,-6);c.lineTo(24,44);c.lineTo(-24,44);c.closePath();FS('#e8394d',4);P();E(0,19,9,9);c.fillStyle='#ffd23f';c.fill()},
  brokolica(){P();c.moveTo(-10,0);c.lineTo(-8,44);c.lineTo(9,44);c.lineTo(11,0);c.closePath();FS('#a8d86a',4);[[-24,-8,17],[22,-8,17],[0,-26,22],[-9,-2,15],[11,-4,15]].forEach(b=>{P();E(b[0],b[1],b[2],b[2]);FS('#3f9a3a',3.5)});c.fillStyle='rgba(20,80,20,.45)';P();E(-4,-28,3,3);E(8,-20,3,3);E(-20,-10,3,3);E(22,-6,3,3);c.fill();hl(-6,-34,7,4,.35)},
  mesiac(){crescent(38,31,18,-14);FS('#ffd84a',4);P();c.moveTo(-26,4);c.quadraticCurveTo(-20,10,-12,6);c.lineWidth=3.5;c.strokeStyle=OL;c.stroke();P();E(-24,16,4,3);c.fillStyle='rgba(255,120,120,.6)';c.fill();c.save();c.translate(26,-26);c.scale(.28,.28);ICON.star();c.restore();c.save();c.translate(34,10);c.scale(.18,.18);ICON.star();c.restore()},
  tablet(){P();rr(-42,-30,84,60,10);FS('#333a48',4);P();rr(-34,-22,68,44,4);c.fillStyle='#4fb3ff';c.fill();P();E(-12,0,9,9);c.fillStyle='#ffd23f';c.fill();P();c.moveTo(4,10);c.lineTo(16,-12);c.lineTo(26,10);c.closePath();c.fillStyle='#ff6f91';c.fill()},
  jablko(){P();c.moveTo(0,-20);c.bezierCurveTo(30,-38,48,-6,36,18);c.bezierCurveTo(26,44,8,42,0,36);c.bezierCurveTo(-8,42,-26,44,-36,18);c.bezierCurveTo(-48,-6,-30,-38,0,-20);c.closePath();FS('#e8443a',4);hl(-18,-4,7,11,.45);P();c.moveTo(0,-20);c.quadraticCurveTo(2,-34,8,-40);c.lineWidth=5;c.strokeStyle=OL;c.stroke();P();c.moveTo(6,-30);c.quadraticCurveTo(20,-44,34,-34);c.quadraticCurveTo(20,-24,6,-30);c.closePath();FS('#5bbf3c',3)},
  mrkva(){c.save();c.rotate(.55);[[-8,-28,-16,-48],[0,-28,0,-52],[8,-28,16,-48]].forEach(l=>{P();c.moveTo(l[0],l[1]);c.lineTo(l[2],l[3]);c.lineWidth=11;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=6;c.strokeStyle='#5bbf3c';c.stroke()});P();c.moveTo(-16,-24);c.quadraticCurveTo(0,-34,16,-24);c.lineTo(3,46);c.quadraticCurveTo(0,50,-3,46);c.closePath();FS('#ff8a1f',4);c.strokeStyle='rgba(150,60,0,.6)';c.lineWidth=3;P();c.moveTo(-10,-8);c.lineTo(-2,-8);c.moveTo(4,8);c.lineTo(9,8);c.moveTo(-5,22);c.lineTo(1,22);c.stroke();c.restore()},
  banan(){c.save();c.rotate(-.5);crescent(40,36,0,-16);FS('#ffd93d',4);P();E(-38,-6,4,4);E(38,-6,4,4);c.fillStyle='#6b4a2e';c.fill();c.restore()},
  home(){P();c.moveTo(-36,-2);c.lineTo(0,-36);c.lineTo(36,-2);c.lineTo(26,-2);c.lineTo(26,32);c.lineTo(-26,32);c.lineTo(-26,-2);c.closePath();FS('#ff8a3c',4.5);P();rr(-9,8,18,24,3);FS('#8a4b26',3.5)},
  replay(){const R0=27,a0=-PI*.15,a1=PI*1.5;P();c.arc(0,2,R0,a0,a1);c.lineWidth=13;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=7;c.strokeStyle='#3a9bea';c.stroke();
    const ex=Math.cos(a1)*R0,ey=2+Math.sin(a1)*R0,dx=-Math.sin(a1),dy=Math.cos(a1);P();c.moveTo(ex+dx*16,ey+dy*16);c.lineTo(ex-dy*14,ey+dx*14);c.lineTo(ex+dy*14,ey-dx*14);c.closePath();FS('#3a9bea',3.5)},
  next(){P();c.moveTo(-22,-32);c.lineTo(32,0);c.lineTo(-22,32);c.closePath();FS('#4cc35a',4.5)},
  book(){P();c.moveTo(0,-26);c.quadraticCurveTo(-20,-36,-44,-30);c.lineTo(-44,28);c.quadraticCurveTo(-20,22,0,32);c.quadraticCurveTo(20,22,44,28);c.lineTo(44,-30);c.quadraticCurveTo(20,-36,0,-26);c.closePath();FS('#fff7e0',4);P();c.moveTo(0,-26);c.lineTo(0,32);c.stroke();c.save();c.translate(22,0);c.scale(.36,.36);ICON.heart();c.restore();c.save();c.translate(-22,0);c.scale(.34,.34);ICON.star();c.restore()},
  snd(){P();c.moveTo(-34,-12);c.lineTo(-18,-12);c.lineTo(2,-30);c.lineTo(2,30);c.lineTo(-18,12);c.lineTo(-34,12);c.closePath();FS('#7a64d8',4);c.lineWidth=5;c.strokeStyle=OL;c.lineCap='round';
    if(SAVE.snd){P();c.arc(6,0,16,-.8,.8);c.stroke();P();c.arc(6,0,30,-.8,.8);c.stroke()}else{P();c.moveTo(14,-14);c.lineTo(38,14);c.moveTo(38,-14);c.lineTo(14,14);c.strokeStyle='#e8394d';c.lineWidth=7;c.stroke()}},
  lock(){P();c.arc(0,-6,17,PI,0);c.lineWidth=9;c.strokeStyle=OL;c.stroke();c.lineWidth=4;c.strokeStyle='#c9ced8';c.stroke();P();rr(-25,-8,50,40,9);FS('#f2b33d',4);P();E(0,8,5,5);c.fillStyle=OL;c.fill();c.fillRect(-2,10,4,10)},

function burst(x,y,col,n,sp){for(let k=0;k<(n||12);k++){const a=rnd(0,TAU),s=rnd(100,sp||380);FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.8),max:.8,r:rnd(5,12),col})}FX.push({x,y,ring:1,life:.35,max:.35,r:16,col:'#fff'})}
function stars(x,y,n){for(let k=0;k<n;k++){const a=rnd(0,TAU),s=rnd(80,260);FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.6,1),max:1,r:rnd(14,22),star:1,rot:rnd(0,6)})}}
function confetti(n){const cols=['#ff4d6d','#ffd23f','#4cc35a','#45a6ee','#a35bd6','#ff9b22'];for(let k=0;k<n;k++)FX.push({x:rnd(0,VW),y:rnd(-200,-10),vx:rnd(-40,40),vy:rnd(120,260),life:rnd(2.5,4),max:4,r:rnd(7,12),col:pick(cols),conf:1,rot:rnd(0,6),vr:rnd(-6,6)})}
function updFX(dt){for(let k=FX.length-1;k>=0;k--){const f=FX[k];f.life-=dt;if(f.life<=0){FX.splice(k,1);continue}f.x+=f.vx*dt||0;f.y+=f.vy*dt||0;if(f.conf){f.rot+=f.vr*dt}else if(!f.ring){f.vx*=.94;f.vy=f.vy*.94+(f.star?200*dt:0)}}}
function drawFX(){for(const f of FX){const a=clamp(f.life/f.max*1.4,0,1);c.globalAlpha=a;
  if(f.ring){const q=f.r+(1-f.life/f.max)*90;P();E(f.x,f.y,q,q);c.lineWidth=6;c.strokeStyle=f.col;c.stroke()}
  else if(f.star){icon('star',f.x,f.y,f.r/45,f.rot)}
  else if(f.conf){c.save();c.translate(f.x,f.y);c.rotate(f.rot);c.fillStyle=f.col;c.fillRect(-f.r*.5,-f.r*.3,f.r,f.r*.6);c.restore()}
  else{P();E(f.x,f.y,f.r,f.r);c.fillStyle=f.col;c.fill()}}c.globalAlpha=1}

  if(!sv.seen){sv.seen=1;store();say(PL==='adamko'?'Ahoj Adamko! Ja som Bielko, biela krvinka. Strážim tvoje telo pred zloduchmi. Ťukni na koliečko a ideme na to!':'Ahoj Maťko! Ja som Bielko, biela krvinka. Bývam v tvojom tele a strážim ho. Zlý Kráľ Chrípkoš a jeho zloduchovia, baktérie a vírusy, chcú, aby si ochorel. Porazíme ich spolu zdravými vecami! Ťukni na koleno, tam začíname.')}

  else say(pick(['Kam letíme teraz? Ťukni na svietiace miesto.','Zloduchovia nedajú pokoj! Ťukni na svietiace miesto.']))}
function mapGeom(){const sc=Math.min(.95,(VH-70)/680),bx=VW/2,by=48+82*sc;return {sc,bx,by,P:(p)=>[bx+p[0]*sc,by+p[1]*sc]}}
function drawMap(dt){MAPT+=dt;softBg('#fff4e8','#fbd9c8');c.fillStyle='rgba(244,170,160,.18)';for(let k=0;k<6;k++){P();E(VW*(k/5),VH*(.2+.6*(k%2)),160,120);c.fill()}
  const m=mapGeom(),sv=SAVE[PL],cur=curLv(PL),all=doneCount(PL)>=LV.length;
  c.save();c.translate(m.bx,m.by);c.scale(m.sc,m.sc);drawBody({});c.restore();
  LV.forEach((L,i)=>{const p=m.P(L.pt),q=m.P(L.co);c.setLineDash([2,14]);P();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.lineWidth=7;c.strokeStyle='rgba(58,37,48,.55)';c.lineCap='round';c.stroke();c.setLineDash([]);P();E(p[0],p[1],9,9);FS(i===cur&&!all?'#ffd23f':'#fff',3)});
  LV.forEach((L,i)=>{const q=m.P(L.co),done=!!sv.lv[i],lock=i>cur,isCur=i===cur&&!all;const r=58;
    if(isCur){P();E(q[0],q[1],r+14+Math.sin(T*5)*5,r+14+Math.sin(T*5)*5);c.fillStyle='rgba(255,210,63,.45)';c.fill()}
    button(q[0],q[1],r,rr2=>{if(lock){c.globalAlpha=.35}drawFoe(L.foe,0,0,rr2*.42,T+i,{});c.globalAlpha=1;if(lock)icon('lock',rr2*.45,rr2*.45,.42);if(done){P();E(rr2*.55,-rr2*.55,16,16);FS('#4cc35a',3);c.lineWidth=5;c.strokeStyle='#fff';P();c.moveTo(rr2*.55-7,-rr2*.55);c.lineTo(rr2*.55-1,-rr2*.55+6);c.lineTo(rr2*.55+8,-rr2*.55-6);c.stroke()}},{id:'lv'+i,col:lock?'#e6dcd6':done?'#fff3c4':'#fff',pulse:isCur});
    btns[btns.length-1].fn=()=>{if(lock){SFX.wrong();say('Najprv porazíme zloduchov na svietiacom mieste.')}else goIntro(i)};
    if(done){const st=sv.lv[i];for(let k=0;k<3;k++)icon(k<st?'star':'starOff',q[0]-30+k*30,q[1]+r+18,.28)}});
  if(!all){const q=m.P(LV[cur].co),side=LV[cur].co[0]<0?1:-1;drawHero(q[0]+side*100,q[1]-30+Math.sin(T*3)*8,34,{happy:1,lx:-side*.6})}
  else{c.save();c.translate(m.bx,m.by-90*m.sc);c.scale(.9,.9);c.translate(0,-30);P();c.moveTo(-42,10);c.lineTo(-48,-30);c.lineTo(-24,-8);c.lineTo(0,-40);c.lineTo(24,-8);c.lineTo(48,-30);c.lineTo(42,10);c.closePath();FS('#ffcf3a',4);c.restore()}
  homeBtn(()=>{go('select');say('Kto ide hrať? Maťko, alebo Adamko?')});

/* --- príbeh a výber zbrane --- */
function goIntro(i){const L=LV[i],easy=PL==='adamko';let opts=L.opts.slice();if(easy)opts=[opts[0],opts[1]];opts.sort(()=>Math.random()-.5);
  I={i,L,t:0,phase:'story',opts,shake:{},ok:false};go('intro');say(tx(easy?L.storyA:L.story),()=>{if(scr==='intro'&&I.phase==='story')toChoose()})}
function toChoose(){I.phase='choose';I.ct=0;say(I.L.ask+(PL==='adamko'?' Ťukni na to, čo svieti.':''))}
function chooseOpt(o){if(I.phase!=='choose'||I.ok)return;const L=I.L;
  if(o===L.w){I.ok=true;I.phase='go';SFX.right();stars(VW/2,VH*.75,10);say(L.right,()=>{if(scr==='intro'&&I.phase==='go')startLevel(I.i)});setTimeout(()=>{if(scr==='intro'&&I.phase==='go'&&!speaking())startLevel(I.i)},7000)}
  else{I.shake[o]=.6;SFX.wrong();SFX.laugh();say(L.wrong[o]||'Nie, skús iné.')}}
function drawIntro(dt){const L=I.L;I.t+=dt;softBg('#fff4e8','#fbd9c8');
  const z=Math.min(2.2,I.t*1.8+1),fp=L.pt,cxs=VW/2,cys=VH*.36;
  c.save();c.translate(cxs-fp[0]*z*.95,cys-fp[1]*z*.95);c.scale(z*.95,z*.95);drawBody(L.prop);c.restore();
  const n=PL==='adamko'?3:5;for(let k=0;k<n;k++){const a=k/n*TAU+I.t*.5,g2=Math.min(1,I.t*.7),rx=g2*(VW*.3+(k%2)*50),ry=g2*(200+(k%2)*30);drawFoe(L.foe,cxs+Math.cos(a)*rx,cys+40+Math.sin(a)*ry,30+(k%3)*6,T+k,{})}
  const hx=Math.min(VW*.16,-80+I.t*400);drawHero(hx,VH*.42+Math.sin(T*3)*10,62,{happy:I.phase==='go',weapon:I.phase==='go'?L.w:null,wave:I.phase==='story'});
  if(I.phase==='story'){btns.push({x:VW/2,y:VH/2,r:3000,fn:()=>{if(I.t>1.2){hush();toChoose()}},id:'skip'})}
  if(I.phase!=='story'){I.ct=(I.ct||0)+dt;const k=I.opts.length,sp=Math.min(270,VW/(k+.6));I.opts.forEach((o,j)=>{const x=VW/2+(j-(k-1)/2)*sp,y=VH*.77,sh=I.shake[o]||0;if(sh>0)I.shake[o]=sh-dt;
    const glow=(PL==='adamko'&&o===L.w&&I.phase==='choose');const appear=clamp(I.ct*3-j*.4,0,1);if(appear<=0)return;
    if(I.phase==='go'&&o!==L.w)return;
    if(glow){P();E(x,y,104+Math.sin(T*6)*8,104+Math.sin(T*6)*8);c.fillStyle='rgba(255,226,90,.55)';c.fill()}
    button(x+Math.sin(sh*40)*sh*20,y,88*appear,o,()=>chooseOpt(o),{id:'op'+o,is:.0145,pulse:glow||(I.phase==='go'),col:(I.phase==='go')?'#e6ffd9':'#fffaf2'})})}
  homeBtn(goMap);sndBtn()}

function startLevel(i){const L=LV[i],easy=PL==='adamko',sv=SAVE[PL];
  G={i,L,th:TH[L.th],easy,t:0,scroll:0,hero:{x:220,y:VH/2,tx:220,ty:VH/2,r:46,inv:0,slow:0,power:0,hurtT:0},

function spawnFoe(x,y,mini){const e=G.easy,i=G.i;const r=e?56:(mini?34:40+((Math.random()*8)|0));let hp=e?1:(i>=3?2:1)+(Math.random()<.18+i*.05?1:0);if(mini)hp=1;

function nearestTarget(x,y){let best=null,bd=1e9;for(const f of G.foes){const d=hyp(f.x-x,f.y-y);if(f.x<VW+20&&d<bd){bd=d;best=f}}if(G.boss&&G.boss.st!=='in'&&hyp(G.boss.x-x,G.boss.y-y)<bd)best=G.boss;return best}
function fire(){const h=G.hero;if(G.easy){const t=nearestTarget(h.x,h.y);if(!t)return;G.shots.push({x:h.x+44,y:h.y+12,vx:600,vy:0,r:24,home:t,rot:0})}
  else{const n=h.power>0?3:1;for(let k=0;k<n;k++)G.shots.push({x:h.x+44,y:h.y+12,vx:760,vy:(k-(n-1)/2)*170,r:17,rot:0})}SFX.shot()}

  const L=LV[i];say('Získal si kartičku! Zapamätaj si: '+(easy?L.lessonA:L.lesson)+(fin?' A porazil si všetkých zloduchov! Si hlavný strážca tela!':''))}
function lessonCard(i,x,y,w,h,big){const L=LV[i];c.save();c.translate(x,y);P();rr(-w/2,-h/2,w,h,28);FS('#fffaf0',5);P();rr(-w/2+12,-h/2+12,w-24,h-24,20);c.lineWidth=4;c.strokeStyle=FOECOL[L.foe==='sopl'?'virus':L.foe];c.setLineDash([12,10]);c.stroke();c.setLineDash([]);
  const k=h/440;icon(L.w,-w*.16,-h*.02,1.9*k);drawHero(w*.2,-h*.06,62*k,{happy:1,wave:big,lx:-.6});drawFoe(L.foe,w*.38,h*.27,24*k,T,{sad:1});
  c.save();c.translate(-w*.38,h*.3);c.scale(k*.9,k*.9);icon(L.opts[1],0,0,.75);P();c.moveTo(-34,-34);c.lineTo(34,34);c.moveTo(34,-34);c.lineTo(-34,34);c.lineWidth=12;c.strokeStyle=OL;c.lineCap='round';c.stroke();c.lineWidth=7;c.strokeStyle='#e8394d';c.stroke();c.restore();
  c.restore()}
function drawResult(dt){R.t+=dt;const L=LV[R.i],th=TH[L.th];softBg('#fff4e8',th.b1);ambCells(.25);
  const w=Math.min(VW*.6,680),h=Math.min(400,VH*.56),y=VH*.45;
  for(let k=0;k<3;k++){const show=R.t>.4+k*.45;if(show&&!R['s'+k]){R['s'+k]=1;if(k<R.st){SFX.star();stars(VW/2+(k-1)*100,VH*.1,5)}}const sc=show?(k<R.st?.62+Math.max(0,.3-(R.t-.4-k*.45))*1.5:.55):0;if(sc>0)icon(k<R.st?'star':'starOff',VW/2+(k-1)*100,VH*.1,sc)}
  lessonCard(R.i,VW/2,y,w,h,true);btns.push({x:VW/2,y,r:h*.5,fn:()=>{const easy=PL==='adamko';say(easy?L.lessonA:L.lesson)},id:'card'});
  button(VW/2+w/2-10,y-h/2+10,34,'speak',()=>{say(PL==='adamko'?L.lessonA:L.lesson)},{is:.008});
  const by=VH-74;button(VW/2-190,by,54,'home',goMap,{is:.013});button(VW/2,by,54,'replay',()=>goIntro(R.i),{is:.013});
  if(R.i<LV.length-1)button(VW/2+190,by,62,'next',()=>goIntro(R.i+1),{is:.015,pulse:1,col:'#e6ffd9'});else button(VW/2+190,by,62,'next',goMap,{is:.015,pulse:1,col:'#e6ffd9'});
  if(R.fin&&Math.random()<.05)confetti(3);drawFX()}

/* ================= KARTIČKY ================= */
function goBook(){go('book');BK={sel:-1};const n=SAVE[PL].cards.length;say(n?'Tvoje kartičky. Ťukni na kartičku a Bielko ti ju prečíta.':'Zatiaľ nemáš žiadnu kartičku. Poraz zloduchov a získaš ju!')}
function drawBook(){softBg('#fff4e8','#fbd9c8');const sv=SAVE[PL],cols=3,gw=Math.min(VW-120,1100),cw=gw/cols-24,ch=Math.min(250,(VH-170)/2-20);
  LV.forEach((L,i)=>{const col=i%cols,row=(i/cols)|0,x=VW/2-gw/2+(col+.5)*(gw/cols),y=150+ch/2+row*(ch+30),has=sv.cards.indexOf(i)>=0;const sel=BK.sel===i?1.05+Math.sin(T*6)*.02:1;
    c.save();c.translate(x,y);c.scale(sel,sel);if(has)lessonCard(i,0,0,cw,ch,false);else{P();rr(-cw/2,-ch/2,cw,ch,24);FS('rgba(255,255,255,.5)',4);icon('lock',0,0,.9)}c.restore();
    btns.push({x,y,r:Math.min(cw,ch)/2,fn:()=>{if(has){BK.sel=i;say(PL==='adamko'?L.lessonA:L.lesson)}else{SFX.wrong();say('Túto kartičku ešte nemáš.')}},id:'bk'+i})});
  homeBtn(goMap);sndBtn()}

/* ================= SLUČKA ================= */
let last=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;btns=[];c.setTransform(S,0,0,S,0,0);
  try{
    if(location.hash==='#icon'){softBg('#fde3d6','#ef8f88');rbc(VW*.2,VH*.82,70,false,.4,.5);rbc(VW*.85,VH*.2,60,false,-.3,.5);drawFoe('bacil',VW*.74,VH*.74,90,1,{});drawHero(VW*.44,VH*.47,215,{happy:1,blink:0});}
    else if(scr==='splash')drawSplash();
    else if(scr==='select')drawSelect();
    else if(scr==='map')drawMap(dt);
    else if(scr==='intro')drawIntro(dt);
    else if(scr==='play'){updPlay(dt);if(scr==='play')drawPlay()}
    else if(scr==='result')drawResult(dt);
    else if(scr==='book')drawBook();
    if(scr!=='play')updFX(dt);
  }catch(e){console.error(e)}
  if(fade>0){fade=Math.max(0,fade-dt*3);c.fillStyle='rgba(255,244,232,'+fade+')';c.fillRect(0,0,VW,VH)}
  musicTick()}
function toV(e){return {x:e.clientX*DPR/S,y:e.clientY*DPR/S}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(hyp(b.x-p.x,b.y-p.y)<b.r)return b}return null}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toV(e);const b=hitBtn(p);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(b&&!(scr==='play'&&b.id==='skip')){press={id:b.id,fn:b.fn,x:b.x,y:b.y,r:b.r};return}
  if(scr==='play')playDown(p)});
cv.addEventListener('pointermove',e=>{if(scr==='play')playMove(toV(e))});
cv.addEventListener('pointerup',e=>{const p=toV(e);prime();if(press){const pr=press;press=null;if(hyp(pr.x-p.x,pr.y-p.y)<pr.r+30){if(pr.id!=='skip'&&pr.id!=='card')SFX.tap();pr.fn()}return}if(scr==='play')playUp(p)});
cv.addEventListener('pointercancel',()=>{press=null;if(G)G.drag=null});
addEventListener('touchend',()=>{ac();prime()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hush();if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
/* celá obrazovka na šírku (ak to prehliadač dovolí) */
const FSC={on:()=>document.fullscreenElement||document.webkitFullscreenElement,can:()=>document.fullscreenEnabled||document.webkitFullscreenEnabled,land:()=>innerWidth>innerHeight};
function fsGo(){if(!FSC.can()||FSC.on()||!FSC.land())return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
['pointerup','touchend'].forEach(ev=>addEventListener(ev,fsGo,true));
resize();requestAnimationFrame(frame);
window.__T={get G(){return G},go,goMap,goIntro,startLevel,goResult,goBook,setPL:p=>{PL=p},icon:()=>scr,winLevel:()=>{if(G&&G.boss)winLevel()},SAVE:()=>SAVE};
</script>
